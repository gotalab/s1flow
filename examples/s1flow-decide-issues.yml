# Label new issues with gh-ruff-area's current policy (linter / formatter / server / configuration).
# A result below the policy's probability floor gets `needs-triage`; other results get `area:*`.
# `connections` is deliberate: every connection listed in that s1flow.toml is granted to this workflow.
# Store the returned decision_id with the issue if a later label will be recorded as feedback. Each run
# keeps its log as an artifact; measure production from the combined logs with:
#   gh run download --pattern 's1flow-log-*' --dir logs && s1flow feedback measure gh-ruff-area logs/*/*.jsonl
# Copy to .github/workflows/ on the default branch (issue events run only from there).
name: s1flow decide issues
on:
  issues:
    types: [opened, labeled]
permissions:
  contents: read
  issues: write
jobs:
  decide:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: state
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          {
            echo 'json<<S1FLOW_EOF'
            jq -cn --arg t "$TITLE" --arg b "${BODY:0:1500}" '{title: $t, body: $b}'
            echo 'S1FLOW_EOF'
          } >> "$GITHUB_OUTPUT"
      - id: s1
        uses: gotalab/s1flow/decide@v0.1.0a2
        continue-on-error: true  # a failed call leaves the issue as it is
        with:
          working-directory: s1flow
          policy: gh-ruff-area
          state: ${{ steps.state.outputs.json }}
          connections: s1flow.toml
          case-id: "#${{ github.event.issue.number }}"
          log: ${{ runner.temp }}/s1flow-log.jsonl
        env:
          # The s1flow.toml above is the trusted allow-list; these are the keys its listed connections may read.
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Act on the answer
        if: steps.s1.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          ANSWER: ${{ steps.s1.outputs.answer }}
          PROBABILITY: ${{ steps.s1.outputs.probability }}
          BELOW_MIN_PROBABILITY: ${{ steps.s1.outputs.below_min_probability }}
          DECISION_ID: ${{ steps.s1.outputs.decision_id }}
          POLICY: ${{ steps.s1.outputs.policy }}
        run: |
          # This workflow labels only sure answers; another could label every answer, or comment the probability.
          if [ "$BELOW_MIN_PROBABILITY" = true ]; then label="needs-triage"; else label="area:$ANSWER"; fi
          gh label create "$label" --force -R "$GITHUB_REPOSITORY" >/dev/null
          gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --add-label "$label"
          echo "$POLICY: $ANSWER (probability $PROBABILITY, below_min_probability $BELOW_MIN_PROBABILITY, decision_id $DECISION_ID) -> $label" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s1flow-log-${{ github.run_id }}
          path: ${{ runner.temp }}/s1flow-log.jsonl
  feedback:
    # A human label is feedback. This job asks once more so the feedback can use the exact
    # decision_id returned in this run; case_id alone is not a feedback key.
    if: github.event.action == 'labeled' && startsWith(github.event.label.name, 'area:') && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: state
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          {
            echo 'json<<S1FLOW_EOF'
            jq -cn --arg t "$TITLE" --arg b "${BODY:0:1500}" '{title: $t, body: $b}'
            echo 'S1FLOW_EOF'
          } >> "$GITHUB_OUTPUT"
      - id: s1
        uses: gotalab/s1flow/decide@v0.1.0a2
        continue-on-error: true
        with:
          working-directory: s1flow
          policy: gh-ruff-area
          state: ${{ steps.state.outputs.json }}
          connections: s1flow.toml
          case-id: "#${{ github.event.issue.number }}"
          log: ${{ runner.temp }}/s1flow-log.jsonl
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Record the human label
        if: steps.s1.outcome == 'success'
        working-directory: s1flow
        env:
          LABEL: ${{ github.event.label.name }}
          DECISION_ID: ${{ steps.s1.outputs.decision_id }}
        run: |
          label="${LABEL#area:}"
          uvx --from "s1flow==0.1.0a2" s1flow feedback record gh-ruff-area "$DECISION_ID" "$label" \
            --connections s1flow.toml --log "$RUNNER_TEMP/s1flow-log.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s1flow-log-${{ github.run_id }}
          path: ${{ runner.temp }}/s1flow-log.jsonl
