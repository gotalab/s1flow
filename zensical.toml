# The public site: https://gotalab.github.io/s1flow (docs/ plus the bench reports).
# Build: python scripts/site_benchmarks.py && uvx zensical==0.1.1 build --clean
[project]
site_name = "s1flow"
site_description = "Check a repeated judgment on your own data, then hand it to a Decision Model."
site_url = "https://gotalab.github.io/s1flow/"
repo_url = "https://github.com/gotalab/s1flow"
repo_name = "gotalab/s1flow"
edit_uri = "blob/main/docs/"
copyright = "Apache-2.0"
extra_css = ["stylesheets/site.css"]
extra_javascript = ["javascripts/page-menu.js", "javascripts/bench-table.js", "javascripts/language.js"]
nav = [
  { "Home" = "index.md" },
  { "Get started" = "get-started.md" },
  { "Concepts" = "concepts.md" },
  { "Guides" = [
    { "Evaluate and compare" = "evaluate.md" },
    { "Policies, evidence and releases" = "policies.md" },
    { "Run decisions in your app" = "app.md" },
    { "Feedback and improvement" = "feedback.md" },
    { "Connections and discovery" = "connections.md" },
    { "CLI, agents and CI" = "cli-and-ci.md" },
    { "Develop s1flow" = "development.md" },
  ] },
  { "Benchmarks" = "benchmarks/index.md" },
]

[project.theme]
language = "en"
favicon = "images/favicon.svg"
logo = "images/favicon.svg"
custom_dir = "docs/.overrides"
features = [
  "content.action.copy",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.plugins.llmstxt]
full_output = "llms-full.txt"
markdown_description = "s1flow measures Decision Models on your own labeled cases, then runs the one you choose in your app exactly as measured."

[project.plugins.llmstxt.sections]
"Start here" = ["index.md", "get-started.md", "concepts.md"]
"Guides" = ["evaluate.md", "policies.md", "app.md", "feedback.md", "connections.md", "cli-and-ci.md", "development.md"]
"Benchmarks" = ["benchmarks/index.md", "benchmarks/[!i]*.md"]

# The language selector in the header. docs-ja/ holds the Japanese pages (zensical.ja.toml builds them into /ja/).
[[project.extra.alternate]]
name = "English"
link = "/s1flow/"
lang = "en"

[[project.extra.alternate]]
name = "日本語"
link = "/s1flow/ja/"
lang = "ja"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.details = {}
