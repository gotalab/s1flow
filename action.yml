name: s1flow check
description: >
  Ask the policy the base branch ships and the one this change ships about today's test cases, compare them
  case by case, and keep one comment on the pull request up to date. Fails when the change is worse, and, unless
  on-pending is `warn`, when it cannot tell (a pull request from a fork has no keys for answers not cached).
inputs:
  tasks:
    description: Task ids, space-separated. Default every task with a current policy.
    default: ""
  against:
    description: The version to compare with (vN or current). Default the version current names on the base commit (the PR's base branch, or the commit before a push), else current.
    default: ""
  candidate:
    description: current, vN or `draft`. Default current when it differs from the version compared with, else the edited question.
    default: ""
  sample:
    description: Check this many test cases per task (a cheap PR check). Empty checks them all.
    default: ""
  cached-only:
    description: "`auto` (no calls on a pull request from a fork, which gets no secrets), `true` or `false`."
    default: auto
  on-pending:
    description: "`fail` (a check with no verdict fails: nothing unmeasured merges) or `warn` (it warns and passes)."
    default: fail
  working-directory:
    description: The project directory, with s1flow.toml (`s1flow init` makes s1flow/).
    default: s1flow
  package:
    description: Where to install s1flow from when the project's pyproject.toml does not list it (a requirement with the `eval` extra the CLI needs, e.g. `s1flow[eval] @ git+https://...`). Empty runs this Action's own copy with the dependency versions in its uv.lock, so the CLI is the version of the Action; a project that lists s1flow runs the s1flow it locked.
    default: ""
  comment:
    description: Keep a comment on the pull request.
    default: "true"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
    - name: Restore the answer cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.working-directory }}/.cache
        key: s1flow-cache-1-${{ github.run_id }}  # -1-: the answer shape of 2026-10-22
        restore-keys: s1flow-cache-1-
    - name: Check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TASKS: ${{ inputs.tasks }}
        AGAINST: ${{ inputs.against }}
        CANDIDATE: ${{ inputs.candidate }}
        SAMPLE: ${{ inputs.sample }}
        CACHED_ONLY: ${{ inputs.cached-only }}
        ON_PENDING: ${{ inputs.on-pending }}
        COMMENT: ${{ inputs.comment }}
        FORK: ${{ github.event.pull_request.head.repo.fork }}
        PR: ${{ github.event.pull_request.number }}
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        WORKDIR: ${{ inputs.working-directory }}
        PACKAGE: ${{ inputs.package }}
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set +e -uo pipefail  # the runner starts bash with -e; an exit code here is a result, not a crash
        case "$ON_PENDING" in fail|warn) ;; *) echo "::error::on-pending is fail or warn, not '$ON_PENDING'"; exit 1;; esac
        out="$RUNNER_TEMP/s1flow"; mkdir -p "$out"
        if [ -z "$TASKS" ]; then
          TASKS=$(for f in policies/*/channels.json; do jq -e '.channels.current' "$f" >/dev/null && basename "$(dirname "$f")"; done | tr '\n' ' ')
          if [ -z "$TASKS" ] && compgen -G 'policies/*/channels.json' >/dev/null; then
            echo "::error::no policies/*/channels.json names a current version; s1flow adopt TASK CANDIDATE picks one"; exit 1
          fi
        fi
        # base_version: the version the base commit ships (empty when it has none); merging this change makes the
        # working tree's current the one that runs. A lookup that fails for another reason than a missing file fails
        # the check: what it would be compared with is not known.
        lookup="$RUNNER_TEMP/s1flow-base.err"
        dir="${WORKDIR#./}"; dir="${dir%/}"; [ "$dir" = . ] && dir=""
        re_dir=$(printf '%s' "$dir" | sed 's/[][\.*^$+?(){}|]/\\&/g')  # the directory as a regular expression
        shipped() {
          base_version=""
          local body
          [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] || return 0
          if body=$(gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/${dir:+$dir/}policies/$1/channels.json?ref=$BASE" 2>"$lookup"); then
            base_version=$(jq -r '.channels.current // empty' <<<"$body" 2>"$lookup") && return 0
          elif grep -q "HTTP 404" "$lookup"; then
            return 0
          fi
          echo "::error title=s1flow check::$1: could not read the base commit's channels.json ($(head -c 200 "$lookup" | tr '\n' ' '))"
          printf '%s\n### s1flow check · %s\n\n> [!CAUTION]\n> Could not read the base commit'"'"'s `channels.json`, so what this change is compared with is not known. The check fails.\n' \
            "<!-- s1flow-check:$1 -->" "$1" > "$out/$1.md"
          return 1
        }
        publish() {  # the step summary, and the pull request's comment kept up to date
          [ -f "$out/$1.md" ] || return 0
          cat "$out/$1.md" >> "$GITHUB_STEP_SUMMARY"
          if [ "$COMMENT" = true ] && [ -n "$PR" ]; then
            marker="<!-- s1flow-check:$1 -->"
            id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
            if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$out/$1.md" >/dev/null
            else gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$out/$1.md" >/dev/null; fi
          fi
        }
        # the files this change touches, as "status filename" (a renamed file's old name as "renamed-from"): the check reads
        # both versions, the rules and the cases from the change itself, so an edit to a saved version fails and an
        # edit to the rules or the cases is flagged. Not knowing the files fails: a rewritten version could pass. GitHub
        # lists at most 3000 files, so a change that touches that many is not known either.
        changed=""; listed=0
        if [ -n "$PR" ]; then
          if changed=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
              --jq '.[] | "\(.status) \(.filename)", (select(.previous_filename) | "\(.status)-from \(.previous_filename)")' 2>"$lookup"); then
            if [ "$(grep -cv '^[a-z]*-from ' <<<"$changed")" -ge 3000 ]; then
              echo "::error title=s1flow check::the pull request touches 3000 files or more, more than GitHub lists, so an edit to a saved version cannot be ruled out"
            else listed=1; fi
          else
            echo "::error title=s1flow check::could not list the pull request's files ($(head -c 200 "$lookup" | tr '\n' ' ')), so an edit to a saved version cannot be ruled out"
          fi
        fi
        args=()
        [ -n "$CANDIDATE" ] && args+=(--candidate "$CANDIDATE")
        [ -n "$SAMPLE" ] && [ -n "$PR" ] && args+=(--sample "$SAMPLE")   # outside a PR, every case
        if [ "$CACHED_ONLY" = true ] || { [ "$CACHED_ONLY" = auto ] && [ "$FORK" = true ]; }; then args+=(--cached-only); fi
        # a project whose pyproject.toml lists s1flow (s1flow's apps/bench, or an app's own) runs the s1flow it locked
        if grep -Eq '"s1flow([][<>=~!; ]|")' pyproject.toml 2>/dev/null; then jf=(uv run --frozen s1flow)
        # otherwise PACKAGE as given, or this Action's copy with the dependency versions its uv.lock pins, in the
        # Action's own environment (a caller's UV_PROJECT_ENVIRONMENT would point the sync at their venv)
        elif [ -n "$PACKAGE" ]; then jf=(uvx --from "$PACKAGE" s1flow)
        else jf=(env -u UV_PROJECT_ENVIRONMENT -u UV_NO_SYNC uv run --project "$ACTION_PATH" --frozen --no-dev --extra eval s1flow); fi
        failed=0
        for t in $TASKS; do
          against="$AGAINST"
          if ! shipped "$t"; then failed=1; publish "$t"; continue; fi
          if [ -z "$against" ]; then against=${base_version:+v$base_version}; against=${against:-current}; fi
          "${jf[@]}" check "$t" --against "$against" "${args[@]}" --json --markdown "$out/$t.md" > "$out/$t.json"
          code=$?
          verdict=$(jq -r '.verdict // "error"' "$out/$t.json" 2>/dev/null || echo error)
          echo "$t: $verdict (exit $code)"
          # a saved version is never rewritten (adopt only adds one): an edited one would be checked as what it now says
          [ -n "$PR" ] && [ "$listed" = 0 ] && failed=1
          rewritten=$(grep -E "^(modified|removed|renamed-from|changed) ${re_dir:+$re_dir/}policies/$t/v[0-9]+(\.evaluation)?\.json$" <<<"$changed" | cut -d' ' -f2- | sed 's/^/`/; s/$/`/' | paste -sd, - | sed 's/,/, /g')
          if [ -n "$rewritten" ]; then
            failed=1; echo "::error title=s1flow check::$t: this change rewrites $rewritten; a saved version is never rewritten (adopt saves a new one)"
            [ -f "$out/$t.md" ] && printf '\n> [!CAUTION]\n> This change rewrites %s. A saved version is never rewritten: `s1flow adopt` saves a new one. The check fails.\n' "$rewritten" >> "$out/$t.md"
          fi
          rules=$(cut -d' ' -f2- <<<"$changed" | grep -E -e "^${re_dir:+$re_dir/}tasks/$t/" -e "^${re_dir:+$re_dir/}s1flow\.toml$" | sed 's/^/`/; s/$/`/' | paste -sd, - | sed 's/,/, /g')
          if [ -n "$rules" ]; then
            echo "::warning title=s1flow check::$t: this change edits $rules, which set the rules or the cases this check applies"
            [ -f "$out/$t.md" ] && printf '\n> [!WARNING]\n> This change edits %s, which set the rules or the cases this check applies (objective, constraints, the held-out test share, labels and corrections, prices). The check above used the edited files: review that diff.\n' "$rules" >> "$out/$t.md"
          fi
          if [ "$code" = 1 ]; then failed=1; echo "::error title=s1flow check::$t is worse than $against";
          elif [ "$code" = 2 ] && [ "$verdict" = pending ] && [ "$ON_PENDING" = warn ]; then echo "::warning title=s1flow check::$t is pending: answers needed that only a run with keys can get";
          elif [ "$code" = 2 ] && [ "$verdict" = pending ]; then failed=1; echo "::error title=s1flow check::$t is pending: answers needed that only a run with keys can get (on-pending: fail)";
          elif [ "$code" != 0 ]; then failed=1; echo "::error title=s1flow check::$t could not be checked (exit $code)"; fi
          publish "$t"
        done
        exit $failed
