# Releases a merge to main that changes pyproject.toml's version: runs the package checks on it, tags it v<version>,
# then publishes to PyPI by trusted publishing (PyPI trusts this file by name, so no token is stored).
# Merging the release pull request (docs/development.md) is the approval; nothing runs on a local machine.
# When a job fails, "Re-run failed jobs" on this run carries on; a later merge never releases in its place, but
# running this workflow from main releases main's version if it has no tag yet.
name: publish
on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:  # from main, after a fix merged to main once the release's checks failed
permissions:
  contents: read
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2  # and the commit before it, to see whether this one changed the version
          persist-credentials: false
      - id: version
        shell: bash  # with pipefail: a failed ls-remote stops here instead of reading as "no tag"
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::publish releases main, not $GITHUB_REF"
            exit 1
          fi
          version_at() { git show "$1:pyproject.toml" | python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["project"]["version"])'; }
          version=$(version_at HEAD)
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$(version_at HEAD^)" = "$version" ]; then
            echo "The version stays $version: nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # the commit the tag points at ("^{}" peels an annotated tag); empty when there is no such tag
          tagged=$(git ls-remote --exit-code origin "refs/tags/$tag" "refs/tags/$tag^{}" | tail -n 1 | cut -f 1 || [ $? = 2 ])
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::this commit sets version $version, but $tag is already on $tagged: set an unreleased version"
            exit 1
          fi
          echo "Releasing $GITHUB_SHA as $tag"
          echo "release=true" >> "$GITHUB_OUTPUT"
  checks:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/tests.yml
  tag:
    needs: [version, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the tag
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then  # a re-run made it
            tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
            [ "$tagged" = "$GITHUB_SHA" ] || { echo "::error::$TAG is on $tagged, not this commit"; exit 1; }
          else
            obj=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$TAG" -f message="$TAG" -f object="$GITHUB_SHA" -f type=commit --jq .sha)
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$obj" > /dev/null
            echo "Tagged $GITHUB_SHA $TAG"
          fi
  pypi:
    needs: tag
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
