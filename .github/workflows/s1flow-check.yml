# The showcase of the s1flow check Action on s1flow's own evaluation project (apps/bench): a PR that changes
# gh-ruff-area's question, policies or the model line-up checks 40 of its test cases and keeps one comment on
# the PR; after the merge, main checks every test case. It checks gh-ruff-area alone (on AI Gateway); the other
# tasks with a current policy, gh-ruff-kind and nod-wake, are not checked here.
# The weekly and manual runs keep main's answer cache warm, which PRs and s1flow-guard.yml read.
name: s1flow check
on:
  pull_request:
    paths: ["apps/bench/tasks/gh-ruff-area/**", "apps/bench/policies/gh-ruff-area/**", "apps/bench/s1flow.toml", ".github/workflows/s1flow-check.yml"]
  push:
    branches: [main]
    paths: ["apps/bench/tasks/gh-ruff-area/**", "apps/bench/policies/gh-ruff-area/**", "apps/bench/s1flow.toml", ".github/workflows/s1flow-check.yml"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          working-directory: apps/bench
          tasks: gh-ruff-area
          sample: "40"
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}  # gh-ruff-area's current runs on d1@vercel
