# The public site (https://gotalab.github.io/s1flow): docs/ and the bench reports, built with Zensical.
# A pull request that touches them builds the site to check it; a push to main builds and publishes it.
# The Benchmarks pages are written from the committed apps/bench/reports: no model is called.
name: site
on:
  push:
    branches: [main]
  pull_request:
    paths: ["docs/**", "apps/bench/reports/**", "plugin/skills/s1flow/scripts/charts.*", "scripts/site_benchmarks.py",
            "zensical.toml", ".github/workflows/site.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:  # one publish at a time; a newer push to a pull request replaces its older build
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: python scripts/site_benchmarks.py
      - run: uvx zensical==0.1.1 build --clean --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        with:
          path: site
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
