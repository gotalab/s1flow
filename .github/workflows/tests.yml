name: package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run mypy src/s1flow
      - run: uv run lint-imports --no-cache
      - run: uv run python scripts/write_schemas.py --check
      - run: uv run python scripts/sync_plugin.py --check
      - run: uv build --wheel
