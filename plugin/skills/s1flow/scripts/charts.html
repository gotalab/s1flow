<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>__TITLE__</title>
<style>
:root { color-scheme:light; font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#202734; background:#fff; --ink:#202734; --muted:#5f6b7c; --faint:#9aa3b1; --line:#e3e7ed; --accent:#3b45c9; --tint:#eef0fd; }
* { box-sizing:border-box; }
body { margin:0; background:#fff; }
main { max-width:1080px; margin:auto; padding:40px 32px 72px; }
h1 { font-size:28px; line-height:1.2; margin:4px 0 0; font-weight:650; }
h2 { font-size:18px; margin:0 0 12px; font-weight:600; }
p { margin:8px 0; }
.meta { color:var(--muted); font-size:13px; }
section { margin-top:40px; }
#decision { margin-top:28px; padding:20px 22px; border-radius:8px; background:var(--tint); }
#decision .lead { font-size:19px; line-height:1.45; margin:0; }
#decision .lead strong { color:var(--accent); }
#decision .why { margin:6px 0 0; color:var(--muted); font-size:14px; }
code { font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
#adopt { display:inline-block; margin-top:12px; padding:5px 10px; border-radius:5px; background:#fff; color:var(--ink); }
.table-wrap { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; font-size:14px; }
th { text-align:right; font-weight:500; color:var(--muted); font-size:12px; border-bottom:1px solid #c9cfd8; padding:8px 10px; white-space:nowrap; }
td { padding:9px 10px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
th.name,td.name { text-align:left; white-space:normal; overflow-wrap:normal; min-width:200px; }
th.orders { color:var(--accent); white-space:normal; min-width:110px; } td.orders { font-weight:600; }
tr.after-tie td { border-top:2px solid #c9cfd8; }
th.strip,td.strip { width:30%; min-width:160px; padding-left:16px; padding-right:16px; }
td.strip svg { display:block; width:100%; height:18px; overflow:visible; }
td.value { font-weight:600; }
tr.top td { background:var(--tint); }
tr.top td.name { font-weight:600; }
tr.out td { color:var(--faint); }
.variant { color:var(--muted); font-weight:400; }
.badge { display:inline-block; white-space:nowrap; margin-left:8px; padding:0 7px; border-radius:9px; font-size:11px; font-weight:600; line-height:18px; vertical-align:1px; }
.badge.first { background:var(--accent); color:#fff; }
.badge.current { border:1px solid var(--ink); color:var(--ink); }
.reason { display:block; font-size:12px; font-weight:400; color:var(--faint); }
.key { display:flex; flex-wrap:wrap; gap:4px 18px; margin:0 0 8px; font-size:12px; color:var(--muted); }
.key i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
details { margin-top:14px; border-top:1px solid var(--line); padding-top:12px; }
details > summary { cursor:pointer; font-weight:600; font-size:15px; }
details > summary .meta { font-weight:400; margin-left:6px; }
details[open] > summary { margin-bottom:12px; }
button,select { font:inherit; color:var(--ink); background:#fff; border:1px solid #bbc3cf; border-radius:4px; min-height:32px; padding:4px 8px; }
button { cursor:pointer; font-size:12px; }
button:focus-visible,summary:focus-visible,select:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
.controls { display:flex; flex-wrap:wrap; gap:10px 20px; align-items:end; margin:0 0 8px; font-size:13px; color:var(--muted); }
.controls label { display:flex; flex-direction:column; gap:3px; }
figure { margin:0; min-width:0; }
figure svg { display:block; width:100%; height:auto; }
.figure-tools { display:flex; justify-content:flex-end; gap:6px; margin-top:4px; }
.figures { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; margin-top:12px; }
#not-compared li { margin:2px 0; font-size:13px; }
#not-compared li span { color:var(--muted); }
dl { display:grid; grid-template-columns:minmax(140px,1fr) 3fr; gap:4px 16px; font-size:13px; }
dt { color:var(--muted); } dd { margin:0; overflow-wrap:anywhere; }
pre { white-space:pre-wrap; overflow-wrap:anywhere; font:12px/1.6 ui-monospace,monospace; }
.measurement { margin:8px 0; }
.measurement summary { font-size:14px; font-weight:500; }
#question { white-space:pre-wrap; font-size:14px; }
#error { color:#9a381b; }
.notice:empty,[hidden] { display:none!important; }
footer { margin-top:40px; color:var(--faint); font-size:12px; overflow-wrap:anywhere; }
@media(max-width:760px) { main { padding:24px 16px 48px; } .figures { grid-template-columns:1fr; } #decision .lead { font-size:17px; } th.strip,td.strip { display:none; } th.name,td.name { min-width:120px; } th { white-space:normal; min-width:72px; } th.orders { min-width:80px; } td { padding:8px 6px; } }
@media print { @page { size:A4 landscape; margin:12mm; } main { max-width:none; padding:0; } .figure-tools,.controls { display:none!important; } details { display:block; } .table-wrap { overflow:visible; } }
</style>
</head>
<body>
<main>
<div id="error" role="alert" hidden></div>
<header>
  <p class="meta" id="context"></p>
  <h1 id="task"></h1>
</header>
<section id="decision" aria-label="Best candidates">
  <p class="lead" id="lead"></p>
  <p class="why" id="why"></p>
  <code id="adopt" hidden></code>
</section>
<section aria-labelledby="ranking-title">
  <h2 id="ranking-title"></h2>
  <div class="key" id="key"></div>
  <div class="table-wrap" tabindex="0" role="region" aria-labelledby="ranking-title"><table><thead id="ranking-head"></thead><tbody id="ranking-body"></tbody></table></div>
</section>
<section aria-label="More detail">
  <details id="tradeoffs"><summary>Trade-offs <span class="meta">any two measures, against each other</span></summary>
    <div class="controls"><label>Vertical<select id="y-axis"></select></label><label>Horizontal<select id="x-axis"></select></label></div>
    <div id="relationship"></div>
  </details>
  <details id="all-metrics"><summary>Every metric <span class="meta" id="metric-count"></span></summary>
    <div class="table-wrap" tabindex="0" role="region" aria-label="Every metric"><table><thead id="metrics-head"></thead><tbody id="metrics-body"></tbody></table></div>
  </details>
  <details id="not-compared-box" hidden><summary>Not compared <span class="meta" id="not-compared-count"></span></summary><ul id="not-compared"></ul></details>
  <details id="diagnostics"><summary>Probability and threshold curves <span class="meta">exploratory, development cases</span></summary>
    <label class="controls">Candidate<select id="diagnostic-candidate"><option value="">Choose a candidate</option></select></label>
    <p id="diagnostic-unavailable" class="meta"></p><div class="figures" id="diagnostic-figures"></div>
  </details>
  <details><summary>How this was measured</summary>
    <p id="question"></p>
    <p class="meta" id="source"></p>
    <div id="metric-definitions"></div>
    <div id="notices" class="meta"></div>
    <div id="measurements"></div>
  </details>
</section>
<p id="export-status" class="meta" role="status"></p>
<footer id="provenance"></footer>
</main>
<script id="comparison-data" type="application/json">__DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('comparison-data').textContent);
const rows=D.candidates, definitions=D.metric_definitions;
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const INK='#202734', MUTED='#5f6b7c', FAINT='#b4bbc6', LINE='#e3e7ed', ACCENT='#3b45c9';
const finite=x=>typeof x==='number'&&Number.isFinite(x);
const fmt=(x,unit='number')=>!finite(x)?'—':unit==='share'?`${(x*100).toFixed(1)}%`:unit==='usd'?`$${x.toLocaleString('en-US',{maximumSignificantDigits:3})}`:unit==='ms'?`${Math.round(x).toLocaleString('en-US')} ms`:x.toLocaleString('en-US',{maximumSignificantDigits:3});
const cost=r=>r.calls?.cost_unknown?null:r.calls?.cost_per_10k_usd;
const latency=r=>r.calls?.latency?.p90_ms;
const figureStore=new Map();
function el(tag,text,cls) { const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n; }
function txt(id,value) { $(id).textContent=value; }
function svgNode(parent,tag,attrs={},text) {const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));if(text!==undefined)n.textContent=text;parent.appendChild(n);return n;}
function label(parent,x,y,text,attrs={}) {return svgNode(parent,'text',{x,y,fill:INK,'font-size':12,'font-family':'Arial, sans-serif',...attrs},text);}
function name(r,parent) {r.model.split(/(?<=[@:])/).forEach((part,i)=>{if(i)parent.append(document.createElement('wbr'));parent.append(document.createTextNode(part));});if(r.variant!=='base')parent.append(el('span',` · ${r.variant}`,'variant'));return parent;}

// The task's objective: the metric the ranking orders by.
const params=D.objective.params||{};
const canonical=value=>JSON.stringify(value,(_,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.keys(v).sort().map(k=>[k,v[k]])):v);
const objectivePrefix=`objective:${D.objective.name}`;
const primary=definitions.find(d=>(D.objective.name==='coverage'&&d.key.startsWith('coverage:')&&Number(d.key.slice(9))===params.target_accuracy)
  ||(d.key.startsWith(objectivePrefix+'{')&&canonical(JSON.parse(d.key.slice(objectivePrefix.length)))===canonical(params)))
  ||{key:null,label:D.objective.label,unit:D.objective.unit==='share'?'share':'number',direction:D.objective.direction,basis:'the task objective'};
const objective=r=>({value:r.value,interval:r.interval});
const better=(a,b)=>primary.direction==='min'?a-b:b-a;

// Who is compared, in the ranking `s1flow report` lists; without one, by the objective alone.
const byName=new Map(rows.map(r=>[r.candidate,r]));
const ranked=D.ranking?D.ranking.filter(p=>byName.has(p.candidate)).map(p=>({row:byName.get(p.candidate),tied:p.tied,excluded:p.excluded||[]}))
  :rows.filter(r=>finite(r.value)&&!r.excluded.length).sort((a,b)=>better(a.value,b.value)).map(row=>({row,tied:false,excluded:[]}));
const shown=new Set(ranked.map(p=>p.row.candidate));
const left=rows.filter(r=>!shown.has(r.candidate));
const topGroup=ranked.filter(p=>p.tied);
const first=topGroup.length===1||(D.order?.by||[]).length?topGroup[0]:undefined;
const tieWords={latency:'p90 latency',cost:'API cost'};
// The tiebreak's objectives get a column beside the objective: they order the tied candidates.
const tieMetrics=(D.order?.by||[]).map(k=>definitions.find(d=>d.key==='objective:'+k)).filter(Boolean);
const tieLabel=k=>tieWords[k]||definitions.find(d=>d.key==='objective:'+k)?.label||k;

function currentWords() {
  if(!D.current)return '';
  if(first&&D.current===first.row.candidate)return 'It is the current policy.';
  if(shown.has(D.current))return `The current policy is ${D.current}.`;
  return byName.has(D.current)?`The current policy, ${D.current}, is not compared (see Not compared below).`:`The current policy, ${D.current}, is not in this comparison.`;
}
function renderDecision() {
  const lead=$('lead');lead.replaceChildren();const why=[];
  if(!ranked.length)lead.textContent='No candidate has an answer to every development case yet.';
  else if(!topGroup.length){
    lead.append('Sorted by ',el('strong',D.objective.label),'.');
    why.push(D.ranking?'No candidate is within the constraints.':D.unranked?`Not ranked: ${D.unranked}.`:'This snapshot holds no ranking; regenerate it with s1flow report TASK --out DIR to see which candidates are tied.');
  } else if(topGroup.length===1){
    const s=el('strong');name(first.row,s);lead.append(s,` is best on ${D.objective.label}: ${fmt(first.row.value,primary.unit)}.`);
  } else if(first){
    const s=el('strong');name(first.row,s);
    lead.append(s,` comes first of the ${topGroup.length} candidates tied on ${D.objective.label}, ordered by ${D.order.by.map(tieLabel).join(', then ')}.`);
  } else {
    lead.append(el('strong',`${topGroup.length} candidates`),` are tied on ${D.objective.label}.`);
    why.push('No tiebreak orders them: compare them on cost and latency below, or name one in task.py’s tiebreak.');
  }
  if(D.order?.why)why.push(D.order.why+'.');
  if(!ranked.length&&D.unranked)why.push(D.unranked);
  const words=currentWords();if(words)why.push(words);
  const blocked=first?.row.adoption_blocked||[];
  if(blocked.length)why.push(`It cannot be adopted: ${blocked.join('; ')}.`);
  txt('why',why.join(' '));
  if(first&&!blocked.length&&D.current!==first.row.candidate){$('adopt').hidden=false;txt('adopt',`s1flow adopt ${D.task} ${first.row.candidate} --reason "..."`);}
}

function intervalScale() {
  const values=ranked.flatMap(p=>[p.row.value,...(p.row.interval||[])]).filter(finite);
  if(!values.length)return null;
  let lo=Math.min(...values),hi=Math.max(...values);
  if(primary.unit==='share'){const step=hi-lo>.3?.1:.05;lo=Math.max(0,Math.floor(lo/step)*step);hi=Math.min(1,Math.ceil(hi/step)*step);}
  if(lo===hi){lo-=1;hi+=1;}
  return [lo,hi];
}
function strip(p,range,isTop,isOut) {
  const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 100 18');svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('aria-hidden','true');
  const X=v=>(v-range[0])/(range[1]-range[0])*100, c=isOut?FAINT:isTop?ACCENT:MUTED;
  svgNode(svg,'line',{x1:0,x2:100,y1:9,y2:9,stroke:LINE,'vector-effect':'non-scaling-stroke'});
  const i=p.row.interval;
  if(i&&i.every(finite))svgNode(svg,'rect',{x:X(i[0]),y:5,width:Math.max(.4,X(i[1])-X(i[0])),height:8,rx:0,fill:c,'fill-opacity':isTop?.28:.18});
  if(finite(p.row.value))svgNode(svg,'rect',{x:X(p.row.value)-.5,y:2,width:1,height:14,fill:c});
  return svg;
}
function renderRanking() {
  txt('ranking-title',`${ranked.length} ${ranked.length===1?'candidate':'candidates'} by ${D.objective.label}, ${primary.direction==='min'?'lower':'higher'} is better`);
  const head=el('tr');
  const range=intervalScale();
  const span=range?` ${fmt(range[0],primary.unit)} – ${fmt(range[1],primary.unit)}`:'';
  for(const [t,c] of [['Candidate','name'],[D.objective.label,''],...tieMetrics.map(d=>[`${d.label} · orders the tie`,'orders']),['95% interval'+span,'strip'],['API cost / 10k',''],['p90 latency','']])head.appendChild(el('th',t,c));
  $('ranking-head').replaceChildren(head);
  const body=$('ranking-body');body.replaceChildren();
  ranked.forEach((p,i)=>{
    const r=p.row,out=p.excluded.length>0;
    const tr=el('tr',undefined,[p.tied?'top':out?'out':'',i&&ranked[i-1].tied&&!p.tied?'after-tie':''].join(' ').trim());
    const cell=name(r,el('td',undefined,'name'));
    if(p===first)cell.appendChild(el('span','first','badge first'));
    if(D.current===r.candidate)cell.appendChild(el('span','current','badge current'));
    if(out)cell.appendChild(el('span',p.excluded.join('; '),'reason'));
    const s=el('td',undefined,'strip');if(range)s.appendChild(strip(p,range,p.tied,out));
    if(r.interval)s.title=`${fmt(r.interval[0],primary.unit)} – ${fmt(r.interval[1],primary.unit)}`;
    const c=el('td',fmt(cost(r),'usd'));if(r.calls?.cost_source&&r.calls.cost_source!=='billed'&&finite(cost(r)))c.title=r.calls.cost_source==='list'?'estimated from list price':r.calls.cost_source;
    tr.append(cell,el('td',fmt(r.value,primary.unit),'value'),...tieMetrics.map(d=>el('td',fmt(r.metrics[d.key]?.value,d.unit),'orders')),s,c,el('td',fmt(latency(r),'ms')));body.appendChild(tr);
  });
  const key=$('key');key.replaceChildren();
  const item=(color,text)=>{const k=el('span');const i=el('i');i.style.background=color;k.append(i,text);key.appendChild(k);};
  if(topGroup.length)item(ACCENT,topGroup.length>1?`tied: ${D.objective.label} cannot tell them apart (intervals overlap the best's)`:'best');
  if(range)item('#cbd0f4','bar: 95% interval, tick: value');
  if(ranked.some(p=>p.excluded.length))item(FAINT,'outside the task’s constraints');
}

// Trade-offs: any two measures; the top group is named on the chart, the rest on hover.
const axes=[...definitions,
  {key:'api-cost',label:'API cost / 10,000 inputs',unit:'usd',direction:'min',basis:'Recorded billed or estimated API costs; unpriced calls remain unknown.',get:cost},
  {key:'latency',label:'p90 latency (ms)',unit:'ms',direction:'min',basis:'Recorded answering-attempt latency.',get:latency}];
const estimate=(r,d)=>d.get?{value:d.get(r)}:r.metrics[d.key]||{};
function niceStep(span) {if(!(span>0))return 1;const p=10**Math.floor(Math.log10(span/4));const n=span/4/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p;}
function tick(x,unit) {return unit==='share'?`${Number((x*100).toFixed(1))}%`:unit==='usd'?`$${x.toLocaleString('en-US',{maximumSignificantDigits:3})}`:x.toLocaleString('en-US',{maximumSignificantDigits:3});}
function range(values,unit) {
  if(!values.length)return [0,1,.25];
  const low=Math.min(...values),high=Math.max(...values),step=niceStep(Math.max(high-low,Math.abs(high)*.05,unit==='share'?.01:1e-6));
  let lo=Math.floor(low/step)*step,hi=Math.ceil(high/step)*step;if(lo===hi){lo-=step;hi+=step;}
  if(unit==='share'){lo=Math.max(0,lo);hi=Math.min(1,hi);} if(unit==='usd'||unit==='ms')lo=Math.max(0,lo);
  return [lo,hi,step];
}
function newSvg(title) {const svg=document.createElementNS(NS,'svg');svg.setAttribute('xmlns',NS);svg.setAttribute('role','img');svg.setAttribute('aria-label',title);svgNode(svg,'title',{},title);svgNode(svg,'rect',{width:'100%',height:'100%',fill:'#fff'});return svg;}
function finish(svg,width,height,caption) {label(svg,16,height,caption,{'font-size':10,fill:MUTED});svg.setAttribute('viewBox',`0 0 ${width} ${height+12}`);svg.setAttribute('width',width);svg.setAttribute('height',height+12);return svg;}
function relationshipFigure(xd,yd,width) {
  const title=`${yd.label} × ${xd.label}`, svg=newSvg(title);
  const points=ranked.map(p=>({p,x:estimate(p.row,xd).value,y:estimate(p.row,yd).value})).filter(q=>finite(q.x)&&finite(q.y));
  const [xlo,xhi,xstep]=range(points.map(q=>q.x),xd.unit),[ylo,yhi,ystep]=range(points.map(q=>q.y),yd.unit);
  const L=64,R=width-24,T=40,H=width<500?260:340,B=T+H;
  const X=v=>L+10+(v-xlo)/(xhi-xlo)*(R-L-20),Y=v=>B-10-(v-ylo)/(yhi-ylo)*(H-20);
  const xTick=R-L<420?xstep*2:xstep;
  for(let t=xlo;t<=xhi+xstep*.01;t+=xTick){svgNode(svg,'line',{x1:X(t),x2:X(t),y1:T,y2:B,stroke:LINE});label(svg,X(t),B+18,tick(t,xd.unit),{'text-anchor':'middle','font-size':11,fill:MUTED});}
  for(let t=ylo;t<=yhi+ystep*.01;t+=ystep){svgNode(svg,'line',{x1:L,x2:R,y1:Y(t),y2:Y(t),stroke:LINE});label(svg,L-8,Y(t)+4,tick(t,yd.unit),{'text-anchor':'end','font-size':11,fill:MUTED});}
  label(svg,R,B+36,`${xd.label} (${xd.direction==='min'?'lower':'higher'} is better) →`,{'text-anchor':'end','font-size':12,fill:MUTED});
  label(svg,L,T-22,`↑ ${yd.label} (${yd.direction==='min'?'lower':'higher'} is better)`,{'font-size':12,fill:MUTED});
  // Dots first, then names where they fit: the tied and the current candidate; any other name is on hover.
  const marks=points.map(q=>({q,x:X(q.x),y:Y(q.y)}));
  for(const m of [...marks].sort((a,b)=>Number(a.q.p.tied)-Number(b.q.p.tied))){const c=m.q.p.excluded.length?FAINT:m.q.p.tied?ACCENT:'#8a93a3';
    const dot=svgNode(svg,'circle',{cx:m.x,cy:m.y,r:m.q.p.tied?5:4,fill:c});
    svgNode(dot,'title',{},`${m.q.p.row.candidate}: ${yd.label} ${fmt(m.q.y,yd.unit)}, ${xd.label} ${fmt(m.q.x,xd.unit)}`);}
  const boxes=marks.map(m=>[m.x-5,m.y-5,m.x+5,m.y+5]);
  const free=b=>b[0]>=L&&b[2]<=R&&b[1]>=T&&b[3]<=B&&!boxes.some(o=>b[0]<o[2]&&o[0]<b[2]&&b[1]<o[3]&&o[1]<b[3]);
  let unnamed=0;
  for(const m of marks.filter(m=>m.q.p.tied||D.current===m.q.p.row.candidate)){
    const text=m.q.p.row.candidate,w=text.length*6.4,h=12;
    const spot=[[8,4,'start'],[-8,4,'end'],[-w/2,-10,'start'],[-w/2,18,'start']].map(([dx,dy,anchor])=>{const x0=anchor==='end'?m.x+dx-w:m.x+dx;return {box:[x0,m.y+dy-h+2,x0+w,m.y+dy+2],x:m.x+dx,y:m.y+dy,anchor};}).find(o=>free(o.box));
    if(!spot){unnamed++;continue;}
    boxes.push(spot.box);label(svg,spot.x,spot.y,text,{'text-anchor':spot.anchor,'font-size':11,fill:m.q.p.tied?ACCENT:INK});
  }
  if(!points.length)label(svg,L+12,T+40,'No candidate has both measures.',{fill:MUTED});
  return finish(svg,width,B+58,`${points.length} of ${ranked.length} candidates${unnamed?` (${unnamed} tied names hidden where they overlap; hover a dot)`:''} · ${D.task} · ${D.n} development cases · snapshot ${D.id.slice(0,12)}`);
}
function plotFigure(title,basis,width,points,xTitle,yTitle,{target=null,diagonal=false}={}) {
  const svg=newSvg(title);label(svg,16,22,title,{'font-size':14});label(svg,16,40,basis,{'font-size':11,fill:MUTED});
  const L=56,R=width-20,T=56,B=T+200,X=x=>L+x*(R-L),Y=y=>B-y*200;
  if(finite(target)){svgNode(svg,'line',{x1:L,x2:R,y1:Y(target),y2:Y(target),stroke:MUTED,'stroke-dasharray':'4 4'});label(svg,R-4,Y(target)-5,`target ${fmt(target,'share')}`,{'text-anchor':'end','font-size':10,fill:MUTED});}
  for(let i=0;i<=4;i++){const v=i/4;svgNode(svg,'line',{x1:L,x2:R,y1:Y(v),y2:Y(v),stroke:LINE});label(svg,L-6,Y(v)+4,`${v*100}%`,{'text-anchor':'end','font-size':10,fill:MUTED});label(svg,X(v),B+16,`${v*100}%`,{'text-anchor':'middle','font-size':10,fill:MUTED});}
  if(diagonal)svgNode(svg,'line',{x1:X(0),x2:X(1),y1:Y(0),y2:Y(1),stroke:MUTED,'stroke-dasharray':'4 4'});
  const good=points.filter(p=>finite(p[0])&&finite(p[1]));
  if(!diagonal&&good.length>1)svgNode(svg,'polyline',{points:good.map(p=>`${X(p[0])},${Y(p[1])}`).join(' '),fill:'none',stroke:ACCENT,'stroke-width':2});
  if(diagonal)for(const p of good)svgNode(svg,'circle',{cx:X(p[0]),cy:Y(p[1]),r:3.5,fill:ACCENT});
  label(svg,(L+R)/2,B+34,xTitle,{'text-anchor':'middle','font-size':11,fill:MUTED});
  label(svg,13,(T+B)/2,yTitle,{transform:`rotate(-90 13 ${(T+B)/2})`,'text-anchor':'middle','font-size':11,fill:MUTED});
  return finish(svg,width,B+52,`Exploratory development values · ${D.task} · snapshot ${D.id.slice(0,12)}`);
}
function mountFigure(parent,id,build) {
  const figure=el('figure');const holder=el('div');figure.appendChild(holder);
  const tools=el('div',undefined,'figure-tools');for(const type of ['svg','png']){const b=el('button',type.toUpperCase());b.type='button';b.setAttribute('aria-label',`Save ${id} as ${type.toUpperCase()}`);b.addEventListener('click',()=>downloadFigure(id,type));tools.appendChild(b);}figure.appendChild(tools);parent.appendChild(figure);
  figureStore.set(id,{holder,build});drawFigure(id);
}
function drawFigure(id) {const f=figureStore.get(id);if(!f||!f.holder.isConnected||!f.holder.offsetParent)return;const width=Math.max(320,Math.round(f.holder.getBoundingClientRect().width));f.holder.replaceChildren(f.build(width));}
function download(blob,name) {const url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function downloadFigure(id,type) {
  try {
    const f=figureStore.get(id);const svg=f.build(900);const xml=new XMLSerializer().serializeToString(svg);const blob=new Blob([xml],{type:'image/svg+xml;charset=utf-8'});const name=`${D.task}-${id}`.replace(/[^a-zA-Z0-9._-]/g,'-');
    if(type==='svg')download(blob,`${name}.svg`);
    else {const url=URL.createObjectURL(blob);try {const img=new Image();img.src=url;await img.decode();const canvas=document.createElement('canvas');canvas.width=1800;canvas.height=Number(svg.getAttribute('height'))*2;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);const png=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!png)throw new Error('PNG export unavailable');download(png,`${name}.png`);}finally{URL.revokeObjectURL(url);}}
    txt('export-status',`${type.toUpperCase()} saved with its source.`);
  }catch(error){txt('export-status',`Could not export: ${error.message}`);}
}
function renderRelationship() {
  const parent=$('relationship');parent.replaceChildren();figureStore.delete('tradeoff');
  const xd=axes.find(d=>d.key===$('x-axis').value),yd=axes.find(d=>d.key===$('y-axis').value);
  mountFigure(parent,'tradeoff',width=>relationshipFigure(xd,yd,width));
}

function renderMetrics() {
  txt('metric-count',`${definitions.length} metrics, cost and latency`);
  const head=el('tr');const name0=el('th','Candidate','name');head.appendChild(name0);
  for(const d of definitions)head.appendChild(el('th',d.label));
  for(const t of ['p50 latency','p99 latency','Answered'])head.appendChild(el('th',t));
  $('metrics-head').replaceChildren(head);const body=$('metrics-body');body.replaceChildren();
  for(const p of ranked){const r=p.row,tr=el('tr',undefined,p.tied?'top':'');tr.appendChild(name(r,el('td',undefined,'name')));
    for(const d of definitions){const m=r.metrics[d.key];const cell=el('td',fmt(m?.value,d.unit));if(m?.interval)cell.title=`${fmt(m.interval[0],d.unit)} – ${fmt(m.interval[1],d.unit)}`;tr.appendChild(cell);}
    const l=r.calls?.latency||{};tr.append(el('td',fmt(l.p50_ms,'ms')),el('td',fmt(l.p99_ms,'ms')),el('td',`${r.n} / ${D.n}`));body.appendChild(tr);}
}
function renderNotCompared() {
  if(!left.length)return;
  $('not-compared-box').hidden=false;
  const never=left.filter(r=>!r.n), other=left.filter(r=>r.n);
  txt('not-compared-count',`${left.length} candidates${never.length?`, ${never.length} never run`:''}`);
  const list=$('not-compared');
  for(const r of other){const li=el('li',r.candidate);li.append(el('span',` — ${r.excluded.join('; ')||'not ranked'}`));list.appendChild(li);}
  if(never.length){const li=el('li',`No runs: ${never.map(r=>r.candidate).join(', ')}`);list.appendChild(li);}
}
function renderDiagnostics() {
  const parent=$('diagnostic-figures');parent.replaceChildren();for(const key of [...figureStore.keys()])if(key.startsWith('diagnostic-'))figureStore.delete(key);
  const r=rows.find(r=>r.candidate===$('diagnostic-candidate').value);txt('diagnostic-unavailable','');if(!r)return;
  const c=r.charts||{};const basis=`${r.candidate} · ${r.n} answered development cases`;
  if(c.selection_sweep?.length)mountFigure(parent,'diagnostic-coverage',width=>plotFigure('Accepted share and accuracy',basis,width,c.selection_sweep.map(p=>[p.coverage,p.sure_accuracy]),'Accepted share','Accuracy of accepted',{target:D.objective.name==='coverage'?params.target_accuracy:null}));
  if(c.threshold_sweep?.length)mountFigure(parent,'diagnostic-precision-recall',width=>plotFigure('Precision and recall across cutoffs',basis,width,c.threshold_sweep.map(p=>[p.recall,p.precision]),'Recall','Precision'));
  if(c.calibration?.length)mountFigure(parent,'diagnostic-calibration',width=>plotFigure('Predicted and observed positive share',basis,width,c.calibration.map(p=>[p.probability,p.observed]),D.kind_params?.positive?`Predicted P(${D.kind_params.positive})`:'Predicted P(True)','Observed positive share',{diagonal:true}));
  txt('diagnostic-unavailable',c.selection_unavailable||c.unavailable||(!parent.children.length?'No probability curves recorded for this candidate.':''));
}
function renderContext() {
  const base=rows.find(r=>r.variant==='base')||rows[0];txt('question',base?.question?.instructions||'');txt('source',D.source?`Cases: ${D.source}`:'');
  for(const d of definitions){const p=el('p',undefined,'meta');p.append(el('strong',`${d.label}. `),document.createTextNode(d.basis));$('metric-definitions').appendChild(p);}
  const targets=Object.entries(D.constraints||{}).filter(([,v])=>v!==null&&v!==undefined);
  if(targets.length)$('notices').appendChild(el('p',`Constraints: ${targets.map(([k,v])=>`${k} = ${typeof v==='object'?JSON.stringify(v):v}`).join(' · ')}.`));
  for(const note of D.notices||[])$('notices').appendChild(el('p',note));
  for(const p of ranked){const r=p.row,detail=el('details',undefined,'measurement');detail.appendChild(el('summary',r.candidate));const dl=el('dl');const l=r.calls?.latency||{};
    const values=[['Answered / labelled',`${r.n} / ${D.n}`],['Refused / failed / missing',`${r.failures?.refused_cases??'unknown'} / ${r.failures?.failed_cases??'unknown'} / ${r.failures?.never_asked??'unknown'}`],['Provider / model',`${r.measurement?.provider} / ${r.measurement?.model_id}`],['Probability evidence',r.measurement?.distribution||'unknown'],['Recorded concurrency',(l.concurrency||[]).join(', ')||'unknown'],['p50 / p90 / p99',`${fmt(l.p50_ms,'ms')} / ${fmt(l.p90_ms,'ms')} / ${fmt(l.p99_ms,'ms')}`],['Cost basis',`${r.calls?.cost_source||'unknown'} · ${r.calls?.cost_unknown||0} unpriced calls`],['Fitted reading rule',JSON.stringify(r.rule)]];
    for(const [k,v] of values)dl.append(el('dt',k),el('dd',String(v)));detail.appendChild(dl);detail.appendChild(el('pre',JSON.stringify(r.question,null,2)));$('measurements').appendChild(detail);}
}
try {
  if(D.schema!=='s1flow/comparison@2')throw new Error('Generate a new comparison snapshot with s1flow report TASK --out DIR.');
  txt('task',D.task);
  txt('context',`${D.n} labelled development cases · objective: ${D.objective.label} · ${new Date(D.at).toISOString().slice(0,10)}`);
  renderDecision();renderRanking();renderMetrics();renderNotCompared();
  for(const id of ['x-axis','y-axis'])for(const d of axes){const option=el('option',d.label);option.value=d.key;$(id).appendChild(option);}
  $('x-axis').value='api-cost';$('y-axis').value=primary.key&&axes.some(d=>d.key===primary.key)?primary.key:axes[0].key;
  for(const id of ['x-axis','y-axis'])$(id).addEventListener('change',renderRelationship);
  $('tradeoffs').addEventListener('toggle',()=>{if($('tradeoffs').open)renderRelationship();});
  for(const p of ranked){const option=el('option',p.row.candidate);option.value=p.row.candidate;$('diagnostic-candidate').appendChild(option);}
  $('diagnostic-candidate').addEventListener('change',renderDiagnostics);$('diagnostics').addEventListener('toggle',()=>{if($('diagnostics').open)renderDiagnostics();});
  renderContext();txt('provenance',`Snapshot ${D.id} · computed ${D.at} · development cases only; the held-out test is read when you adopt. Regenerate after changing data, instructions or models.`);
  let frame;new ResizeObserver(()=>{cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{for(const id of figureStore.keys())drawFigure(id);});}).observe(document.querySelector('main'));
}catch(error){$('error').hidden=false;txt('error',`Could not display this report: ${error.message}`);console.error(error);}
</script>
</body>
