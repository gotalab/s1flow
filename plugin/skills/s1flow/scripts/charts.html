<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>__TITLE__</title>
<style>
:root { color-scheme:light; font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#202734; background:#fff; --ink:#202734; --muted:#5f6b7c; --faint:#9aa3b1; --line:#e3e7ed; --accent:#3b45c9; --tint:#eef0fd; }
* { box-sizing:border-box; }
body { margin:0; background:#fff; }
main { max-width:1180px; margin:auto; padding:40px 32px 72px; }
h1 { font-size:28px; line-height:1.2; margin:4px 0 0; font-weight:650; }
h2 { font-size:18px; margin:0 0 6px; font-weight:600; }
p { margin:8px 0; }
.meta { color:var(--muted); font-size:13px; }
section { margin-top:32px; }
#measures { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 14px; }
#measures label { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border:1px solid #c9cfd8; border-radius:14px; font-size:13px; cursor:pointer; user-select:none; }
#measures label:has(input:checked) { background:var(--tint); border-color:var(--accent); color:var(--accent); }
#measures input { margin:0; accent-color:var(--accent); }
.table-wrap { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; font-size:14px; }
th { text-align:right; font-weight:500; color:var(--muted); font-size:12px; border-bottom:1px solid #c9cfd8; padding:8px 10px; vertical-align:bottom; }
th button { all:unset; cursor:pointer; display:inline-block; text-align:right; }
th button:hover,th button:focus-visible { color:var(--ink); text-decoration:underline; }
th[aria-sort] button { color:var(--ink); font-weight:600; }
td { padding:8px 10px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
th.name,td.name { text-align:left; min-width:190px; white-space:normal; }
td.name { font-weight:500; }
.variant { color:var(--muted); font-weight:400; }
td.cell { min-width:92px; }
.bar { display:block; height:4px; margin-top:4px; background:var(--line); border-radius:2px; }
.bar i { display:block; height:4px; border-radius:2px; background:#aab1bf; margin-left:auto; }
td.best { color:var(--accent); font-weight:650; }
td.best .bar i { background:var(--accent); }
tr.front td.name::before { content:"◆"; color:var(--accent); margin:0 6px 0 -16px; font-size:11px; }
tr.front td.name { padding-left:26px; }
tr.front td.name, tr.front td:first-child { font-weight:650; }
td.name { padding-left:26px; }
.key { margin:8px 0 0; font-size:12px; color:var(--muted); }
.key b { color:var(--accent); }
details { margin-top:14px; border-top:1px solid var(--line); padding-top:12px; }
details > summary { cursor:pointer; font-weight:600; font-size:15px; }
details > summary .meta { font-weight:400; margin-left:6px; }
details[open] > summary { margin-bottom:12px; }
button,select { font:inherit; color:var(--ink); background:#fff; border:1px solid #bbc3cf; border-radius:4px; min-height:32px; padding:4px 8px; }
.figure-tools button { cursor:pointer; font-size:12px; }
button:focus-visible,summary:focus-visible,select:focus-visible,#measures label:focus-within { outline:2px solid var(--accent); outline-offset:3px; }
.controls { display:flex; flex-wrap:wrap; gap:10px 20px; align-items:end; margin:0 0 8px; font-size:13px; color:var(--muted); }
.controls label { display:flex; flex-direction:column; gap:3px; }
figure { margin:0; min-width:0; }
figure svg { display:block; width:100%; height:auto; }
.figure-tools { display:flex; justify-content:flex-end; gap:6px; margin-top:4px; }
.figures { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; margin-top:12px; }
#not-compared li { margin:2px 0; font-size:13px; }
#not-compared li span { color:var(--muted); }
dl { display:grid; grid-template-columns:minmax(140px,1fr) 3fr; gap:4px 16px; font-size:13px; }
dt { color:var(--muted); } dd { margin:0; overflow-wrap:anywhere; }
pre { white-space:pre-wrap; overflow-wrap:anywhere; font:12px/1.6 ui-monospace,monospace; }
.measurement { margin:8px 0; }
.measurement summary { font-size:14px; font-weight:500; }
#question { white-space:pre-wrap; font-size:14px; }
#error { color:#9a381b; }
[hidden] { display:none!important; }
footer { margin-top:40px; color:var(--faint); font-size:12px; overflow-wrap:anywhere; }
@media(max-width:760px) { main { padding:24px 16px 48px; } .figures { grid-template-columns:1fr; } th.name,td.name { min-width:130px; } td.cell { min-width:72px; } td,th { padding:7px 6px; } }
@media print { @page { size:A4 landscape; margin:12mm; } main { max-width:none; padding:0; } .figure-tools,.controls,#measures { display:none!important; } .table-wrap { overflow:visible; } }
</style>
</head>
<body>
<main>
<div id="error" role="alert" hidden></div>
<header>
  <p class="meta" id="context"></p>
  <h1 id="task"></h1>
</header>
<section aria-labelledby="compare-title">
  <h2 id="compare-title">Compare candidates</h2>
  <div id="measures" role="group" aria-label="Measures shown"></div>
  <div class="table-wrap" tabindex="0" role="region" aria-labelledby="compare-title"><table><thead id="compare-head"></thead><tbody id="compare-body"></tbody></table></div>
  <p class="key" id="key"></p>
</section>
<section aria-labelledby="tradeoff-title">
  <h2 id="tradeoff-title">Trade-off</h2>
  <div class="controls"><label>Vertical<select id="y-axis"></select></label><label>Horizontal<select id="x-axis"></select></label></div>
  <div id="relationship"></div>
</section>
<section aria-label="More detail">
  <details id="not-compared-box" hidden><summary>Not compared <span class="meta" id="not-compared-count"></span></summary><ul id="not-compared"></ul></details>
  <details id="diagnostics"><summary>Probability and threshold curves <span class="meta">exploratory, development cases</span></summary>
    <label class="controls">Candidate<select id="diagnostic-candidate"><option value="">Choose a candidate</option></select></label>
    <p id="diagnostic-unavailable" class="meta"></p><div class="figures" id="diagnostic-figures"></div>
  </details>
  <details><summary>How this was measured</summary>
    <p id="question"></p>
    <p class="meta" id="source"></p>
    <div id="metric-definitions"></div>
    <div id="notices" class="meta"></div>
    <div id="measurements"></div>
  </details>
</section>
<p id="export-status" class="meta" role="status"></p>
<footer id="provenance"></footer>
</main>
<script id="comparison-data" type="application/json">__DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('comparison-data').textContent);
const rows=D.candidates, definitions=D.metric_definitions;
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const INK='#202734', MUTED='#5f6b7c', LINE='#e3e7ed', ACCENT='#3b45c9';
const finite=x=>typeof x==='number'&&Number.isFinite(x);
const fmt=(x,unit='number')=>!finite(x)?'—':unit==='share'?`${(x*100).toFixed(1)}%`:unit==='usd'?`$${x.toLocaleString('en-US',{maximumSignificantDigits:3})}`:unit==='ms'?`${Math.round(x).toLocaleString('en-US')} ms`:x.toLocaleString('en-US',{maximumSignificantDigits:3});
const figureStore=new Map();
function el(tag,text,cls) { const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n; }
function txt(id,value) { $(id).textContent=value; }
function svgNode(parent,tag,attrs={},text) {const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));if(text!==undefined)n.textContent=text;parent.appendChild(n);return n;}
function label(parent,x,y,text,attrs={}) {return svgNode(parent,'text',{x,y,fill:INK,'font-size':12,'font-family':'Arial, sans-serif',...attrs},text);}
function name(r,parent) {r.model.split(/(?<=[@:])/).forEach((part,i)=>{if(i)parent.append(document.createElement('wbr'));parent.append(document.createTextNode(part));});if(r.variant!=='base')parent.append(el('span',` · ${r.variant}`,'variant'));return parent;}

// The task's objective as a metric key: coverage is kept under its target.
const params=D.objective.params||{};
const objectiveKey=D.objective.name==='coverage'?`coverage:${params.target_accuracy}`:null;
const isTask=k=>k.startsWith('objective:')||k===objectiveKey;
// Every measure the snapshot holds: its metrics, then what the calls took.
const measures=[...definitions.map(d=>({...d,label:isTask(d.key)?`${d.label} · task`:d.label,get:r=>r.metrics[d.key]?.value,interval:r=>r.metrics[d.key]?.interval})),
  {key:'api-cost',label:'API cost / 10k',unit:'usd',direction:'min',basis:'Recorded billed or estimated API cost per 10,000 inputs; unpriced calls remain unknown.',get:r=>r.calls?.cost_unknown?null:r.calls?.cost_per_10k_usd},
  {key:'latency',label:'p90 latency',unit:'ms',direction:'min',basis:'Recorded answering-attempt latency, 90th percentile.',get:r=>r.calls?.latency?.p90_ms}];

// Shown first: the task's own objectives, the metrics that say how often answers are right (those this question
// type has), cost and latency. Calibration (AUROC, Brier, ECE) and the rest are one click away.
const HEADLINE=['accuracy','precision','recall','f1','macro_f1','mae','qwk','mean_iou'];
const taskKeys=definitions.filter(d=>isTask(d.key)).map(d=>d.key);
const typeKeys=HEADLINE.filter(k=>definitions.some(d=>d.key===k));
// A task objective named like a plain metric (objective:accuracy{} beside accuracy) is read by the task's own rule,
// so it is shown in place of the plain one.
const plainOf=k=>k.match(/^objective:(\w+)\{\}$/)?.[1];
const replaced=new Set(taskKeys.map(plainOf).filter(Boolean));
const shown=new Set([...taskKeys,...typeKeys.filter(k=>!replaced.has(k)),'api-cost','latency']);
const primaryKey=taskKeys.find(k=>k===objectiveKey||k.startsWith(`objective:${D.objective.name}{`))||typeKeys[0]||measures[0].key;

// Compared: candidates with an answer to every case they were asked (excluded ones are listed below the table).
const compared=rows.filter(r=>r.n>0&&!r.excluded.length);
const left=rows.filter(r=>!compared.includes(r));
const better=(m,a,b)=>m.direction==='min'?a<b:a>b;

// ◆: no other candidate is as good or better on every measure and better on one. Only the measures every compared
// candidate has take part (an unknown cost cannot be compared); `unused` names the others.
function front(list,shownMs) {
  const ms=shownMs.filter(m=>list.every(r=>finite(m.get(r))));
  const set=new Set(list.filter(r=>!list.some(o=>o!==r&&ms.every(m=>!better(m,m.get(r),m.get(o)))&&ms.some(m=>better(m,m.get(o),m.get(r))))));
  return Object.assign(set,{unused:shownMs.filter(m=>!ms.includes(m))});
}
let sortKey=null, sortAsc=true;
function renderMeasures() {
  const box=$('measures');box.replaceChildren();
  for(const m of measures){const l=el('label'),i=el('input');i.type='checkbox';i.checked=shown.has(m.key);i.addEventListener('change',()=>{i.checked?shown.add(m.key):shown.delete(m.key);renderTable();renderRelationship();});l.append(i,m.label);l.title=m.basis;box.appendChild(l);}
}
function renderTable() {
  const group=m=>isTask(m.key)?0:m.unit==='usd'||m.unit==='ms'?2:1;  // the task's objectives first, then the metrics, then the calls
  const ms=measures.filter(m=>shown.has(m.key)).sort((a,b)=>group(a)-group(b));
  const best=new Map(ms.map(m=>{const v=compared.map(m.get).filter(finite);return [m.key,v.length?(m.direction==='min'?Math.min(...v):Math.max(...v)):null];}));
  const worst=new Map(ms.map(m=>{const v=compared.map(m.get).filter(finite);return [m.key,v.length?(m.direction==='min'?Math.max(...v):Math.min(...v)):null];}));
  const onFront=front(compared,ms);
  const by=measures.find(m=>m.key===(sortKey||primaryKey));
  const order=[...compared].sort((a,b)=>{
    if(!sortKey&&onFront.has(a)!==onFront.has(b))return onFront.has(a)?-1:1;
    const x=by?.get(a),y=by?.get(b);if(!finite(x)||!finite(y))return finite(x)?-1:finite(y)?1:0;
    const d=by.direction==='min'?x-y:y-x;return sortKey&&!sortAsc?-d:d;
  });
  const head=el('tr');head.appendChild(el('th','Candidate','name'));
  for(const m of ms){const th=el('th');const b=el('button',m.label);b.type='button';b.title=`${m.basis} ${m.direction==='min'?'Lower':'Higher'} is better. Sort by it.`;
    b.addEventListener('click',()=>{if(sortKey===m.key)sortAsc=!sortAsc;else{sortKey=m.key;sortAsc=true;}renderTable();});
    if(sortKey===m.key)th.setAttribute('aria-sort',sortAsc?'descending':'ascending');
    b.textContent=`${m.label} ${m.direction==='min'?'↓':'↑'}`;th.appendChild(b);head.appendChild(th);}
  $('compare-head').replaceChildren(head);
  const body=$('compare-body');body.replaceChildren();
  for(const r of order){const tr=el('tr',undefined,onFront.has(r)?'front':'');tr.appendChild(name(r,el('td',undefined,'name')));
    for(const m of ms){const v=m.get(r),b=best.get(m.key),w=worst.get(m.key);const td=el('td',fmt(v,m.unit),'cell'+(finite(v)&&v===b?' best':''));
      if(finite(v)&&finite(b)){const share=b===w?1:(v-w)/(b-w);const bar=el('span',undefined,'bar'),fill=el('i');fill.style.width=`${Math.max(4,share*100)}%`;bar.appendChild(fill);td.appendChild(bar);}
      const i=m.interval?.(r);if(i)td.title=`95% interval ${fmt(i[0],m.unit)} – ${fmt(i[1],m.unit)}`;tr.appendChild(td);}
    body.appendChild(tr);}
  const key=$('key');key.replaceChildren();
  const unused=onFront.unused.length?` (${onFront.unused.map(m=>m.label).join(', ')} left out: unknown for some)`:'';
  key.append(el('b','◆'),` ${onFront.size} of ${compared.length}: no other candidate is as good or better on every measure shown${unused}. `,el('b','Blue'),': best in its column. Bars run from worst to best. Hover a value for its interval.');
}

// Trade-off: any two measures; the ◆ candidates are named, the rest on hover.
function niceStep(span) {if(!(span>0))return 1;const p=10**Math.floor(Math.log10(span/4));const n=span/4/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p;}
function tick(x,unit) {return unit==='share'?`${Number((x*100).toFixed(1))}%`:unit==='usd'?`$${x.toLocaleString('en-US',{maximumSignificantDigits:3})}`:x.toLocaleString('en-US',{maximumSignificantDigits:3});}
function range(values,unit) {
  if(!values.length)return [0,1,.25];
  const low=Math.min(...values),high=Math.max(...values),step=niceStep(Math.max(high-low,Math.abs(high)*.05,unit==='share'?.01:1e-6));
  let lo=Math.floor(low/step)*step,hi=Math.ceil(high/step)*step;if(lo===hi){lo-=step;hi+=step;}
  if(unit==='share'){lo=Math.max(0,lo);hi=Math.min(1,hi);} if(unit==='usd'||unit==='ms')lo=Math.max(0,lo);
  return [lo,hi,step];
}
function newSvg(title) {const svg=document.createElementNS(NS,'svg');svg.setAttribute('xmlns',NS);svg.setAttribute('role','img');svg.setAttribute('aria-label',title);svgNode(svg,'title',{},title);svgNode(svg,'rect',{width:'100%',height:'100%',fill:'#fff'});return svg;}
function finish(svg,width,height,caption) {label(svg,16,height,caption,{'font-size':10,fill:MUTED});svg.setAttribute('viewBox',`0 0 ${width} ${height+12}`);svg.setAttribute('width',width);svg.setAttribute('height',height+12);return svg;}
function relationshipFigure(xd,yd,width) {
  const title=`${yd.label} × ${xd.label}`, svg=newSvg(title);
  const onFront=front(compared,[xd,yd]);
  const points=compared.map(r=>({r,x:xd.get(r),y:yd.get(r)})).filter(q=>finite(q.x)&&finite(q.y));
  const [xlo,xhi,xstep]=range(points.map(q=>q.x),xd.unit),[ylo,yhi,ystep]=range(points.map(q=>q.y),yd.unit);
  const L=64,R=width-24,T=40,H=width<500?260:320,B=T+H;
  const X=v=>L+10+(v-xlo)/(xhi-xlo)*(R-L-20),Y=v=>B-10-(v-ylo)/(yhi-ylo)*(H-20);
  const xTick=R-L<420?xstep*2:xstep;
  for(let t=xlo;t<=xhi+xstep*.01;t+=xTick){svgNode(svg,'line',{x1:X(t),x2:X(t),y1:T,y2:B,stroke:LINE});label(svg,X(t),B+18,tick(t,xd.unit),{'text-anchor':'middle','font-size':11,fill:MUTED});}
  for(let t=ylo;t<=yhi+ystep*.01;t+=ystep){svgNode(svg,'line',{x1:L,x2:R,y1:Y(t),y2:Y(t),stroke:LINE});label(svg,L-8,Y(t)+4,tick(t,yd.unit),{'text-anchor':'end','font-size':11,fill:MUTED});}
  label(svg,R,B+36,`${xd.label} (${xd.direction==='min'?'lower':'higher'} is better) →`,{'text-anchor':'end','font-size':12,fill:MUTED});
  label(svg,L,T-22,`↑ ${yd.label} (${yd.direction==='min'?'lower':'higher'} is better)`,{'font-size':12,fill:MUTED});
  const marks=points.map(q=>({q,x:X(q.x),y:Y(q.y),on:onFront.has(q.r)}));
  for(const m of [...marks].sort((a,b)=>Number(a.on)-Number(b.on))){
    const dot=svgNode(svg,'circle',{cx:m.x,cy:m.y,r:m.on?5:4,fill:m.on?ACCENT:'#9aa3b1'});
    svgNode(dot,'title',{},`${m.q.r.candidate}: ${yd.label} ${fmt(m.q.y,yd.unit)}, ${xd.label} ${fmt(m.q.x,xd.unit)}`);}
  // Names where they fit without covering a dot or another name; the rest are on hover.
  const boxes=marks.map(m=>[m.x-5,m.y-5,m.x+5,m.y+5]);
  const free=b=>b[0]>=L&&b[2]<=R&&b[1]>=T&&b[3]<=B&&!boxes.some(o=>b[0]<o[2]&&o[0]<b[2]&&b[1]<o[3]&&o[1]<b[3]);
  for(const m of marks.filter(m=>m.on)){
    const text=m.q.r.candidate,w=text.length*6.4,h=12;
    const spot=[[8,4,'start'],[-8,4,'end'],[-w/2,-10,'start'],[-w/2,18,'start']].map(([dx,dy,anchor])=>{const x0=anchor==='end'?m.x+dx-w:m.x+dx;return {box:[x0,m.y+dy-h+2,x0+w,m.y+dy+2],x:m.x+dx,y:m.y+dy,anchor};}).find(o=>free(o.box));
    if(!spot)continue;
    boxes.push(spot.box);label(svg,spot.x,spot.y,text,{'text-anchor':spot.anchor,'font-size':11,fill:ACCENT});
  }
  if(!points.length)label(svg,L+12,T+40,'No candidate has both measures.',{fill:MUTED});
  return finish(svg,width,B+58,`◆ ${onFront.size}: not beaten on both · ${points.length} of ${compared.length} candidates · ${D.task} · ${D.n} development cases · snapshot ${D.id.slice(0,12)}`);
}
function plotFigure(title,basis,width,points,xTitle,yTitle,{target=null,diagonal=false}={}) {
  const svg=newSvg(title);label(svg,16,22,title,{'font-size':14});label(svg,16,40,basis,{'font-size':11,fill:MUTED});
  const L=56,R=width-20,T=56,B=T+200,X=x=>L+x*(R-L),Y=y=>B-y*200;
  if(finite(target)){svgNode(svg,'line',{x1:L,x2:R,y1:Y(target),y2:Y(target),stroke:MUTED,'stroke-dasharray':'4 4'});label(svg,R-4,Y(target)-5,`target ${fmt(target,'share')}`,{'text-anchor':'end','font-size':10,fill:MUTED});}
  for(let i=0;i<=4;i++){const v=i/4;svgNode(svg,'line',{x1:L,x2:R,y1:Y(v),y2:Y(v),stroke:LINE});label(svg,L-6,Y(v)+4,`${v*100}%`,{'text-anchor':'end','font-size':10,fill:MUTED});label(svg,X(v),B+16,`${v*100}%`,{'text-anchor':'middle','font-size':10,fill:MUTED});}
  if(diagonal)svgNode(svg,'line',{x1:X(0),x2:X(1),y1:Y(0),y2:Y(1),stroke:MUTED,'stroke-dasharray':'4 4'});
  const good=points.filter(p=>finite(p[0])&&finite(p[1]));
  if(!diagonal&&good.length>1)svgNode(svg,'polyline',{points:good.map(p=>`${X(p[0])},${Y(p[1])}`).join(' '),fill:'none',stroke:ACCENT,'stroke-width':2});
  if(diagonal)for(const p of good)svgNode(svg,'circle',{cx:X(p[0]),cy:Y(p[1]),r:3.5,fill:ACCENT});
  label(svg,(L+R)/2,B+34,xTitle,{'text-anchor':'middle','font-size':11,fill:MUTED});
  label(svg,13,(T+B)/2,yTitle,{transform:`rotate(-90 13 ${(T+B)/2})`,'text-anchor':'middle','font-size':11,fill:MUTED});
  return finish(svg,width,B+52,`Exploratory development values · ${D.task} · snapshot ${D.id.slice(0,12)}`);
}
function mountFigure(parent,id,build) {
  const figure=el('figure');const holder=el('div');figure.appendChild(holder);
  const tools=el('div',undefined,'figure-tools');for(const type of ['svg','png']){const b=el('button',type.toUpperCase());b.type='button';b.setAttribute('aria-label',`Save ${id} as ${type.toUpperCase()}`);b.addEventListener('click',()=>downloadFigure(id,type));tools.appendChild(b);}figure.appendChild(tools);parent.appendChild(figure);
  figureStore.set(id,{holder,build});drawFigure(id);
}
function drawFigure(id) {const f=figureStore.get(id);if(!f||!f.holder.offsetParent)return;const width=Math.max(320,Math.round(f.holder.getBoundingClientRect().width));f.holder.replaceChildren(f.build(width));}
function download(blob,name) {const url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function downloadFigure(id,type) {
  try {
    const f=figureStore.get(id);const svg=f.build(900);const xml=new XMLSerializer().serializeToString(svg);const blob=new Blob([xml],{type:'image/svg+xml;charset=utf-8'});const name=`${D.task}-${id}`.replace(/[^a-zA-Z0-9._-]/g,'-');
    if(type==='svg')download(blob,`${name}.svg`);
    else {const url=URL.createObjectURL(blob);try {const img=new Image();img.src=url;await img.decode();const canvas=document.createElement('canvas');canvas.width=1800;canvas.height=Number(svg.getAttribute('height'))*2;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);const png=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!png)throw new Error('PNG export unavailable');download(png,`${name}.png`);}finally{URL.revokeObjectURL(url);}}
    txt('export-status',`${type.toUpperCase()} saved with its source.`);
  }catch(error){txt('export-status',`Could not export: ${error.message}`);}
}
function renderRelationship() {
  const parent=$('relationship');parent.replaceChildren();figureStore.delete('tradeoff');
  const xd=measures.find(m=>m.key===$('x-axis').value),yd=measures.find(m=>m.key===$('y-axis').value);
  mountFigure(parent,'tradeoff',width=>relationshipFigure(xd,yd,width));
}
function renderNotCompared() {
  if(!left.length)return;
  $('not-compared-box').hidden=false;
  const never=left.filter(r=>!r.n), other=left.filter(r=>r.n);
  txt('not-compared-count',`${left.length} candidates${never.length?`, ${never.length} never run`:''}`);
  const list=$('not-compared');
  for(const r of other){const li=el('li',r.candidate);li.append(el('span',` — ${r.excluded.join('; ')}`));list.appendChild(li);}
  if(never.length)list.appendChild(el('li',`No runs: ${never.map(r=>r.candidate).join(', ')}`));
}
function renderDiagnostics() {
  const parent=$('diagnostic-figures');parent.replaceChildren();for(const key of [...figureStore.keys()])if(key.startsWith('diagnostic-'))figureStore.delete(key);
  const r=rows.find(r=>r.candidate===$('diagnostic-candidate').value);txt('diagnostic-unavailable','');if(!r)return;
  const c=r.charts||{};const basis=`${r.candidate} · ${r.n} answered development cases`;
  if(c.selection_sweep?.length)mountFigure(parent,'diagnostic-coverage',width=>plotFigure('Accepted share and accuracy',basis,width,c.selection_sweep.map(p=>[p.coverage,p.sure_accuracy]),'Accepted share','Accuracy of accepted',{target:D.objective.name==='coverage'?params.target_accuracy:null}));
  if(c.threshold_sweep?.length)mountFigure(parent,'diagnostic-precision-recall',width=>plotFigure('Precision and recall across cutoffs',basis,width,c.threshold_sweep.map(p=>[p.recall,p.precision]),'Recall','Precision'));
  if(c.calibration?.length)mountFigure(parent,'diagnostic-calibration',width=>plotFigure('Predicted and observed positive share',basis,width,c.calibration.map(p=>[p.probability,p.observed]),D.kind_params?.positive?`Predicted P(${D.kind_params.positive})`:'Predicted P(True)','Observed positive share',{diagonal:true}));
  txt('diagnostic-unavailable',c.selection_unavailable||c.unavailable||(!parent.children.length?'No probability curves recorded for this candidate.':''));
}
function renderContext() {
  const base=rows.find(r=>r.variant==='base')||rows[0];txt('question',base?.question?.instructions||'');txt('source',D.source?`Cases: ${D.source}`:'');
  for(const m of measures){const p=el('p',undefined,'meta');p.append(el('strong',`${m.label}. `),document.createTextNode(m.basis));$('metric-definitions').appendChild(p);}
  const targets=Object.entries(D.constraints||{}).filter(([,v])=>v!==null&&v!==undefined);
  if(targets.length)$('notices').appendChild(el('p',`Constraints recorded in task.py: ${targets.map(([k,v])=>`${k} = ${typeof v==='object'?JSON.stringify(v):v}`).join(' · ')}.`));
  for(const note of D.notices||[])$('notices').appendChild(el('p',note));
  for(const r of compared){const detail=el('details',undefined,'measurement');detail.appendChild(el('summary',r.candidate));const dl=el('dl');const l=r.calls?.latency||{};
    const values=[['Answered / labelled',`${r.n} / ${D.n}`],['Refused / failed / missing',`${r.failures?.refused_cases??'unknown'} / ${r.failures?.failed_cases??'unknown'} / ${r.failures?.never_asked??'unknown'}`],['Provider / model',`${r.measurement?.provider} / ${r.measurement?.model_id}`],['Probability evidence',r.measurement?.distribution||'unknown'],['Recorded concurrency',(l.concurrency||[]).join(', ')||'unknown'],['p50 / p90 / p99',`${fmt(l.p50_ms,'ms')} / ${fmt(l.p90_ms,'ms')} / ${fmt(l.p99_ms,'ms')}`],['Cost basis',`${r.calls?.cost_source||'unknown'} · ${r.calls?.cost_unknown||0} unpriced calls`],['Fitted reading rule',JSON.stringify(r.rule)]];
    for(const [k,v] of values)dl.append(el('dt',k),el('dd',String(v)));detail.appendChild(dl);detail.appendChild(el('pre',JSON.stringify(r.question,null,2)));$('measurements').appendChild(detail);}
}
try {
  if(D.schema!=='s1flow/comparison@2')throw new Error('Generate a new comparison snapshot with s1flow report TASK --out DIR.');
  txt('task',D.task);
  txt('context',`${D.question_type} question · ${D.n} labelled development cases · task objective: ${D.objective.label} · ${String(D.at).slice(0,10)}`);
  txt('compare-title',`Compare ${compared.length} candidates`);
  renderMeasures();renderTable();renderNotCompared();
  for(const id of ['x-axis','y-axis'])for(const m of measures){const option=el('option',m.label);option.value=m.key;$(id).appendChild(option);}
  $('x-axis').value='api-cost';$('y-axis').value=primaryKey;
  for(const id of ['x-axis','y-axis'])$(id).addEventListener('change',renderRelationship);
  renderRelationship();
  for(const r of compared){const option=el('option',r.candidate);option.value=r.candidate;$('diagnostic-candidate').appendChild(option);}
  $('diagnostic-candidate').addEventListener('change',renderDiagnostics);$('diagnostics').addEventListener('toggle',()=>{if($('diagnostics').open)renderDiagnostics();});
  renderContext();txt('provenance',`Snapshot ${D.id} · computed ${D.at} · development cases only; the held-out test is read when a candidate is adopted. Regenerate after changing data, instructions or models.`);
  let frame;new ResizeObserver(()=>{cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{for(const id of figureStore.keys())drawFigure(id);});}).observe(document.querySelector('main'));
}catch(error){$('error').hidden=false;txt('error',`Could not display this report: ${error.message}`);console.error(error);}
</script>
</body>
