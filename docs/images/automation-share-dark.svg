  <text class="a" x="380" y="118">93%</text>
  <rect class="track" x="120" y="123" width="250" height="18" rx="5"/>
  <rect class="top" x="120" y="123" width="242.5" height="18" rx="5"/>
  <text class="v" x="380" y="139">97%</text>
