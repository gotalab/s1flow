<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 514" width="860" height="514" role="img" aria-labelledby="t d">
  <title id="t">Similar accuracy, very different share you can automate</title>
  <desc id="d">For each model: a thick bar for the share of cases it can handle automatically at a 95% accuracy target, a thin bar for accuracy over all cases, then median latency and API cost per 10,000 cases. Ruff issues (4 areas · English, 361 cases): Drex Max (Nace AI) 89% automatable, 90.6% accuracy, 230 ms, $0.28; d1.2-ultra (Liquid) 88% automatable, 91.1% accuracy, 145 ms, $0.17; mammoth-1 (Baseten) 87% automatable, 90.3% accuracy, 187 ms, $0.47; d1-ultra (Liquid) 85% automatable, 89.8% accuracy, 232 ms, $0.17; Span-02 (Respan) 82% automatable, 88.9% accuracy, 194 ms, $0.05; Jev 1.14 (TypeSafe) 76% automatable, 85.3% accuracy, 110 ms, $0.29; Clef (Cloudflare) 66% automatable, 86.4% accuracy, 298 ms, $1.10. Latency: 4 calls at once, from Claude's cloud environment (egress in US East, Ashburn); Jev 1.14 and Clef measured on 2026-11-15, the others on 2026-11-23.</desc>
