<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352" width="880" height="352" role="img" aria-labelledby="t d">
  <title id="t">Similar accuracy, very different share you can automate</title>
  <desc id="d">For each model, a thin bar shows accuracy over all cases and a thick bar the share of cases it can handle automatically at a 95% accuracy target. JNLI (Japanese, 3 classes, 300 cases): d1 (Liquid) 97% automatable at 93.0% accuracy, Jev (TypeSafe) 61% at 84.0%, Clef (Cloudflare) 60% at 87.3%, Claude Haiku 4.5 0% at 89.3%. MASSIVE (Japanese, 60 classes, 288 cases): d1 61% at 83.7%, jev 78% at 85.1%, Clef 90% at 89.2%, Haiku 0% at 85.1%. Haiku, asked once, gives every answer the same confidence. Source: apps/bench reports, 2026-10-22.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .bg { fill: #ffffff; }
    .h { font-size: 20px; font-weight: 700; }
    .p { font-size: 15px; font-weight: 700; }
    .ps { font-size: 13px; fill: #6e7781; }
    .n { font-size: 14px; font-weight: 600; }
    .v { font-size: 18px; font-weight: 700; }
    .a { font-size: 12px; fill: #6e7781; }
    .lg { font-size: 13px; fill: #57606a; }
    .f { font-size: 12px; fill: #6e7781; }
    .track { fill: #eff2f5; }
    .acc { fill: #8c959f; }
    .top, .bar { fill: #0969da; }
    .rule { stroke: #d8dee4; }
    @media all {
      text { fill: #e6edf3; }
      .bg { fill: #0d1117; }
      .ps, .a, .f { fill: #8b949e; } .lg { fill: #9198a1; }
      .track { fill: #1c2128; } .acc { fill: #768390; }
      .top, .bar { fill: #4493f8; }
      .rule { stroke: #30363d; }
    }
  </style>
  <rect class="bg" width="880" height="352" rx="16"/>
