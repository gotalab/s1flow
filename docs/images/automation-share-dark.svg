<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 547" width="880" height="547" role="img" aria-labelledby="t d">
  <title id="t">Similar accuracy, very different share you can automate</title>
  <desc id="d">For each model, a thin bar shows accuracy over all cases and a thick bar the share of cases it can handle automatically at a 95% accuracy target. Ruff issues (4 areas · English, 361 cases): d1-ultra (Liquid) 88% automatable at 90.0% accuracy, Drex Max (Nace AI) 87% automatable at 90.3% accuracy, mammoth-1 (Baseten) 86% automatable at 90.9% accuracy, Decider v1.2 (Perplexity) 85% automatable at 90.3% accuracy, Span-02 (Respan) 80% automatable at 88.4% accuracy, Jev 1.14 (TypeSafe) 75% automatable at 85.0% accuracy, Clef (Cloudflare) 69% automatable at 85.6% accuracy. Source: apps/bench reports, 2026-10-31.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .bg { fill: #ffffff; }
    .h { font-size: 20px; font-weight: 700; }
    .p { font-size: 15px; font-weight: 700; }
    .ps { font-size: 13px; fill: #6e7781; }
    .n { font-size: 14px; font-weight: 600; }
    .v { font-size: 18px; font-weight: 700; }
    .a { font-size: 12px; fill: #6e7781; }
    .lg { font-size: 13px; fill: #57606a; }
    .f { font-size: 12px; fill: #6e7781; }
    .track { fill: #eff2f5; }
    .acc { fill: #8c959f; }
    .bar { fill: #0969da; }
    .rule { stroke: #d8dee4; }
    @media all {
      text { fill: #e6edf3; }
      .bg { fill: #0d1117; }
      .ps, .a, .f { fill: #8b949e; } .lg { fill: #9198a1; }
      .track { fill: #1c2128; } .acc { fill: #768390; }
      .bar { fill: #4493f8; }
      .rule { stroke: #30363d; }
    }
  </style>
  <rect class="bg" width="880" height="547" rx="16"/>
  <text class="h" x="28" y="44">Similar accuracy. Very different automation.</text>
  <rect class="acc" x="560" y="31" width="22" height="5" rx="2.5"/>
  <text class="lg" x="590" y="38">accuracy</text>
  <rect class="bar" x="668" y="27" width="22" height="12" rx="4"/>
  <text class="lg" x="698" y="38">automatable at 95%</text>
