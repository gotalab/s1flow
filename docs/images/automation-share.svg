<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 391" width="880" height="391" role="img" aria-labelledby="t d">
  <title id="t">Similar accuracy, very different share you can automate</title>
  <desc id="d">For each model, a thin bar shows accuracy over all cases and a thick bar the share of cases it can handle automatically at a 95% accuracy target. Ruff issues (4 areas · English, 361 cases): d1-ultra (Liquid) 88% automatable at 90.0% accuracy, Decider v1.2 (Perplexity) 85% automatable at 90.3% accuracy, mammoth-1 (Baseten) 86% automatable at 90.9% accuracy, Jev 1.14 (TypeSafe) 75% automatable at 85.0% accuracy. Source: apps/bench reports, 2026-10-31.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .bg { fill: #ffffff; }
    .h { font-size: 20px; font-weight: 700; }
    .p { font-size: 15px; font-weight: 700; }
    .ps { font-size: 13px; fill: #6e7781; }
    .n { font-size: 14px; font-weight: 600; }
    .v { font-size: 18px; font-weight: 700; }
    .a { font-size: 12px; fill: #6e7781; }
    .lg { font-size: 13px; fill: #57606a; }
    .f { font-size: 12px; fill: #6e7781; }
    .track { fill: #eff2f5; }
    .acc { fill: #8c959f; }
    .bar { fill: #0969da; }
    .rule { stroke: #d8dee4; }
  </style>
  <rect class="bg" width="880" height="391" rx="16"/>
  <text class="h" x="28" y="44">Similar accuracy. Very different automation.</text>
  <rect class="acc" x="560" y="31" width="22" height="5" rx="2.5"/>
  <text class="lg" x="590" y="38">accuracy</text>
  <rect class="bar" x="668" y="27" width="22" height="12" rx="4"/>
  <text class="lg" x="698" y="38">automatable at 95%</text>
  <text class="p" x="28" y="88">Ruff issues</text>
  <text class="ps" x="140" y="88">4 areas · English · 361 cases</text>
  <text class="n" x="28" y="137">d1-ultra</text>
  <rect class="acc" x="140" y="112" width="576.2" height="5" rx="2.5"/>
  <text class="a" x="792" y="118">90%</text>
  <rect class="track" x="140" y="123" width="640" height="18" rx="5"/>
  <rect class="bar" x="140" y="123" width="562.0" height="18" rx="5"/>
  <text class="v" x="792" y="139">88%</text>
  <text class="n" x="28" y="189">Decider</text>
  <rect class="acc" x="140" y="164" width="578.0" height="5" rx="2.5"/>
  <text class="a" x="792" y="170">90%</text>
  <rect class="track" x="140" y="175" width="640" height="18" rx="5"/>
  <rect class="bar" x="140" y="175" width="546.0" height="18" rx="5"/>
  <text class="v" x="792" y="191">85%</text>
  <text class="n" x="28" y="241">mammoth-1</text>
  <rect class="acc" x="140" y="216" width="581.5" height="5" rx="2.5"/>
  <text class="a" x="792" y="222">91%</text>
  <rect class="track" x="140" y="227" width="640" height="18" rx="5"/>
  <rect class="bar" x="140" y="227" width="549.6" height="18" rx="5"/>
  <text class="v" x="792" y="243">86%</text>
  <text class="n" x="28" y="293">Jev 1.14</text>
  <rect class="acc" x="140" y="268" width="544.3" height="5" rx="2.5"/>
  <text class="a" x="792" y="274">85%</text>
  <rect class="track" x="140" y="279" width="640" height="18" rx="5"/>
  <rect class="bar" x="140" y="279" width="482.2" height="18" rx="5"/>
  <text class="v" x="792" y="295">75%</text>
  <text class="f" x="28" y="375">apps/bench reports, 2026-10-31 · development cases · a dated snapshot, not a ranking of providers</text>
