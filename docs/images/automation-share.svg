<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 443" width="880" height="443" role="img" aria-labelledby="t d">
  <title id="t">Similar accuracy, very different share you can automate</title>
  <desc id="d">For each model, a thin bar shows accuracy over all cases and a thick bar the share of cases it can handle automatically at a 95% accuracy target. Ruff issues (4 areas · English, 361 cases): d1-ultra (Liquid) 88% automatable at 90.0% accuracy, Decider v1.2 (Perplexity) 85% automatable at 90.3% accuracy, mammoth-1 (Baseten) 86% automatable at 90.9% accuracy, Jev 1.14 (TypeSafe) 75% automatable at 85.0% accuracy, Claude Haiku 5.5 0% automatable at 87.8% accuracy. MASSIVE (60 intents · Japanese, 201 cases): d1-ultra (Liquid) 76% automatable at 86.6% accuracy, Decider v1.2 (Perplexity) 94% automatable at 91.5% accuracy, mammoth-1 (Baseten) 91% automatable at 89.6% accuracy, Jev 1.14 (TypeSafe) 76% automatable at 84.1% accuracy, Claude Haiku 5.5 0% automatable at 85.6% accuracy. Haiku, asked once per case, answers without a probability, so no threshold holds it at 95%. Source: apps/bench reports, 2026-10-31.</desc>
