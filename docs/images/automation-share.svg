<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 514" width="860" height="514" role="img" aria-labelledby="t d">
  <title id="t">Similar accuracy, very different share you can automate</title>
  <desc id="d">For each model: a thick bar for the share of cases it can handle automatically at a 95% accuracy target, a thin bar for accuracy over all cases, then median latency and API cost per 10,000 cases. Ruff issues (4 areas · English, 361 cases): Drex Max (Nace AI) 87% automatable, 90.6% accuracy, 298 ms, $0.28; d1-ultra (Liquid) 86% automatable, 90.9% accuracy, 212 ms, $0.17; mammoth-1 (Baseten) 86% automatable, 90.9% accuracy, 222 ms, $0.47; Decider v1.2 (Perplexity) 85% automatable, 90.3% accuracy, 218 ms, $0.09; Span-02 (Respan) 79% automatable, 88.6% accuracy, 176 ms, $0.05; Jev 1.14 (TypeSafe) 76% automatable, 85.3% accuracy, 143 ms, $0.29; Clef (Cloudflare) 70% automatable, 86.4% accuracy, 345 ms, $1.11. Latency: one model at a time, 4 calls at once, from Claude's cloud environment (egress in US East, Ashburn).</desc>
