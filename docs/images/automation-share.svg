<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 514" width="860" height="514" role="img" aria-labelledby="t d">
  <title id="t">Similar accuracy, very different share you can automate</title>
  <desc id="d">For each model: a thick bar for the share of cases it can handle automatically at a 95% accuracy target, a thin bar for accuracy over all cases, then median latency and API cost per 10,000 cases. Ruff issues (4 areas · English, 361 cases): Drex Max (Nace AI) 89% automatable, 90.6% accuracy, 295 ms, $0.28; Decider (Perplexity) 88% automatable, 91.7% accuracy, 281 ms, $0.09; mammoth-1 (Baseten) 87% automatable, 90.3% accuracy, 288 ms, $0.47; d1-ultra (Liquid) 86% automatable, 90.0% accuracy, 272 ms, $0.17; Span-02 (Respan) 82% automatable, 87.5% accuracy, 274 ms, $0.05; Jev 1.14 (TypeSafe) 77% automatable, 85.0% accuracy, 105 ms, $0.29; Clef (Cloudflare) 70% automatable, 85.6% accuracy, 352 ms, $1.13. Latency: one model at a time, 4 calls at once, from Claude's cloud environment (egress in US East, Ashburn).</desc>
