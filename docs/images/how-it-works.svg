<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 322" width="880" height="322" role="img" aria-labelledby="t d">
  <title id="t">How s1flow works</title>
  <desc id="d">Your coding agent, with the s1flow Skill, collects your labeled cases and measures decision models on them. You choose one. Your app decides with what you measured: sure answers act, unsure ones go to a person. The answers people give become new cases.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="ah"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .bg { fill: #ffffff; }
      .tag { font-size: 12px; font-weight: 700; letter-spacing: .12em; }
      .lbl { font-size: 17px; font-weight: 650; fill: #1f2328; text-anchor: middle; }
      .cap { font-size: 13px; font-weight: 500; fill: #57606a; text-anchor: middle; }
      .pill { font-size: 14px; font-weight: 650; fill: #ffffff; }
      .loop { font-size: 13px; font-weight: 600; fill: #57606a; text-anchor: middle; }
      .ic { fill: none; stroke: #ffffff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .icf { fill: #ffffff; }
      .ln { fill: none; stroke: #8c959f; stroke-width: 2.5; stroke-linecap: round; marker-end: url(#a); }
      .ah { fill: #8c959f; }
      .lp { fill: none; stroke: #8c959f; stroke-width: 2.5; stroke-dasharray: 2 7; stroke-linecap: round; marker-end: url(#a); }
      .za { fill: #fbefff; } .ca { fill: #8250df; } .ta { fill: #8250df; }
      .zb { fill: #fff8c5; } .cb { fill: #bf8700; } .tb { fill: #9a6700; }
      .zc { fill: #ddf4ff; } .cc { fill: #0969da; } .tc { fill: #0969da; }
      .ok { fill: #1a7f37; } .ask { fill: #6e7781; }
    </style>
  </defs>
  <rect class="bg" width="880" height="322" rx="16"/>
  <rect class="za" x="16" y="16" width="344" height="232" rx="18"/><text class="tag ta" x="36" y="44">YOUR AGENT + S1FLOW SKILL</text>
  <rect class="zb" x="376" y="16" width="124" height="232" rx="18"/><text class="tag tb" x="396" y="44">YOU</text>
  <rect class="zc" x="516" y="16" width="348" height="232" rx="18"/><text class="tag tc" x="536" y="44">YOUR APP</text>
  <circle class="ca" cx="100" cy="122" r="40"/><rect class="ic" x="82" y="114" width="26" height="28" rx="4"/><path class="ic" d="M88 108H112V134"/><path class="ic" d="M94 102H118V128"/><text class="lbl" x="100" y="196">Collect</text><text class="cap" x="100" y="217">your labeled cases</text>
  <circle class="ca" cx="268" cy="122" r="40"/><path class="ic" d="M250 139V121M262 139V105M274 139V115M286 139V127"/><text class="lbl" x="268" y="196">Measure</text><text class="cap" x="268" y="217">models on those cases</text>
  <circle class="cb" cx="438" cy="122" r="40"/><path class="ic" d="M421.5 123L432.5 134L454.5 110" style="stroke-width:4"/><text class="lbl" x="438" y="196">Choose</text><text class="cap" x="438" y="217">the one you trust</text>
  <circle class="cc" cx="598" cy="122" r="40"/><path class="ic" d="M584 104H602L612 114V140H584Z"/><path class="ic" d="M591 122H605M591 131H601"/><text class="lbl" x="598" y="196">Decide</text><text class="cap" x="598" y="217">exactly as measured</text>
  <rect class="ok" x="676" y="72" width="176" height="40" rx="20"/><path class="ic" d="M695 92L701 98L711 86" style="stroke-width:2.5"/><text class="pill" x="720" y="97">sure: act</text><rect class="ask" x="676" y="132" width="176" height="40" rx="20"/><circle class="icf" cx="703" cy="146" r="5"/><path class="icf" d="M694 162a9 8 0 0 1 18 0z"/><text class="pill" x="720" y="157">unsure: a person</text>
  <path class="ln" d="M144 122H220"/><path class="ln" d="M312 122H390"/><path class="ln" d="M482 122H550"/><path class="ln" d="M640 110L670 97"/><path class="ln" d="M640 134L670 147"/>
  <path class="lp" d="M764 178V280Q764 298 746 298H42Q24 298 24 280V140Q24 122 42 122H54"/><text class="loop" x="398" y="288">the person’s answer becomes a new case</text>
</svg>
