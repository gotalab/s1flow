# The line-up: every model s1flow can use; `--models` picks from these names (DESIGN.md 3.2). Each entry is a
# `ModelSpec` (s1flow/client/models.py).
#
# Naming: `model` when called through its maker's own API, `model@api` through anyone else
# (vercel = Vercel AI Gateway, openrouter = OpenRouter), or through one of several APIs its maker offers
# (luna@decisions: gpt-6-luna on OpenAI's Decisions API, not the LLM). The version is never in the name: each
# answer records the model that actually answered, and readers pick it (metrics.load).
#
# `versions` lists what a model serves under short names, the same on every model (`1.14`), each with the
# id the provider is sent: `jev:1.14`, `jev@openrouter:1.14`. A version's `capabilities` replace the
# model's field by field. A model with versions whose `id` is none of their ids is an alias
# (`jev-latest`): it runs and compares, and `s1flow adopt` refuses it, since a policy names the version.
#
# `capabilities` declares what the model takes; anything left out is the default
# (boolean / choice / score, no image, a native distribution, 32k tokens). Declare a claim
# only once `s1flow models --verify` passes it (models.verified.json): a 200 does not prove a model
# sees the image. `s1flow models` shows the declarations next to what --verify found.
#
# `price` is a list price, for a model that returns no cost (TypeSafe, Workers AI, OpenAI Decisions): a call's
# cost is then estimated from the tokens it reports and shown as an estimate. Models that return what they billed
# (AI Gateway, OpenRouter) take none. Fields: input_per_mtok, output_per_mtok (USD per million tokens),
# per_request, per_image, as_of (when it was read) and source (where to check it).
#
# `provider` is a built-in kind (s1flow/client/providers/__init__.py: typesafe, gateway, openrouter,
# cloudflare, openai-decisions, llm) or your own as "package.module:factory".

# What `s1flow run` compares without --models. The LLMs are references: name them with --models.
# Each needs only a key: Clef (strongest on many-option routing) needs the clef-proxy relay running, so it
# is named with --models; Kev-4B trailed every Japanese task (research/FINDINGS.md 3).
default = ["jev", "d1@vercel", "luna@decisions"]

[models.jev]
provider = "typesafe"
id = "jev-latest"
# `jev-latest` follows the latest jev (1.13 on 2026-10-16), so it is an alias: it runs and compares, and a
# policy names a version instead (`jev:1.14`).
capabilities.image = true
price.input_per_mtok = 0.042
price.as_of = "2026-10-03"
price.source = "TypeSafe's list price for jev (output free); the API returns no cost"

[models.jev.versions."1.14"]
id = "jev-1.14.0"
capabilities.question_types = ["boolean", "choice", "score", "box"]  # box from 1.14 on: 1.13 answers a bare 400

[models."jev@vercel"]
provider = "gateway"
id = "typesafe-ai/jev"
# `typesafe-ai/jev` follows the latest jev and answers under that alias (it moved from 1.13 to 1.14 around
# 2026-10-14), so its runs cannot say which jev answered: a policy names `jev@vercel:1.14` instead (both
# versions listed on the gateway, 2026-10-19).
note = "Same answers as jev, ~190ms slower (2026-10-07). Text only: the gateway does not pass images to TypeSafe (2026-10-16)."

[models."jev@vercel".versions."1.13"]
id = "typesafe-ai/jev-1.13.0"

[models."jev@vercel".versions."1.14"]
id = "typesafe-ai/jev-1.14.0"

[models."jev@openrouter"]
provider = "openrouter"
id = "typesafe/jev-1.13"  # version 1.13 below, so not an alias
# Each jev version is its own slug on OpenRouter (2026-10-19).
capabilities.image = true

[models."jev@openrouter".versions."1.13"]
id = "typesafe/jev-1.13"  # no box: it answers 400

[models."jev@openrouter".versions."1.14"]
id = "typesafe/jev-1.14"
capabilities.question_types = ["boolean", "choice", "score", "box"]  # IoU 0.88 (2026-10-19)

[models."laya@vercel"]
provider = "gateway"
id = "convaiinnovations/laya"
capabilities.context_tokens = 8192
capabilities.max_instructions_chars = 300
capabilities.max_description_chars = 60
note = "422 on long inputs: an option description of ~100 Japanese characters, or a state of a few thousand (2026-10-03)."

